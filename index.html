  // Capture beforeinstallprompt le plus tôt possible : Chrome peut le déclencher
  // avant que le script principal (en fin de body) ne s'exécute, surtout lors
  // des visites suivantes où les critères d'installabilité sont déjà validés.
  // Sans ce listener précoce, l'événement serait perdu silencieusement et le
  // bouton "Installer l'application" ne s'afficherait jamais.
  window.__deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    window.__deferredInstallPrompt = e;
    if(typeof refreshInstallButton === 'function') refreshInstallButton();
  });
</script>

<!-- Firebase (Firestore backend with offline persistence). Loaded from Google's
     CDN as an ES module: requires internet on first load and to sync, but the
     app continues to work offline afterward via Firestore's local IndexedDB
     cache, syncing automatically once connectivity returns. -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    initializeFirestore, doc, getDoc, setDoc, onSnapshot,
    persistentLocalCache, persistentSingleTabManager,
    disableNetwork, enableNetwork, waitForPendingWrites
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyANWGyR6PSxDVcdlIaU0OX37C2C9H-RfQo",
    authDomain: "male-prestation-services.firebaseapp.com",
    projectId: "male-prestation-services",
    storageBucket: "male-prestation-services.firebasestorage.app",
    messagingSenderId: "403029701376",
    appId: "1:403029701376:web:035154cabe99ae70d8b9e5"
  };

  const fbApp = initializeApp(firebaseConfig);
  // persistentLocalCache = offline-first: reads/writes hit local IndexedDB
  // cache immediately, and sync to the server happens in the background
  // whenever a connection is available.
  const db = initializeFirestore(fbApp, {
    localCache: persistentLocalCache({ tabManager: persistentSingleTabManager({}) })
  });

  // Single shared document holding the whole app DB (mirrors the previous
  // single-blob localStorage model, so no other app code needs to change).
  const DB_DOC = doc(db, "mps", "db");

  window.__firebase = {
    db, DB_DOC, getDoc, setDoc, onSnapshot,
    disableNetwork, enableNetwork, waitForPendingWrites
  };
  window.dispatchEvent(new Event('firebase-ready'));
</script>
<style>
:root{
  --navy-950:#0a0e1a;
  --navy-900:#0f1626;
  --navy-800:#161f35;
  --navy-700:#1e2a45;
  --navy-600:#283759;
  --navy-500:#3a4d78;
  --gold:#f5a623;
  --gold-dim:#c8871a;
  --gold-light:#ffd479;
  --orange:#ff7900;
  --teal:#1fb6a6;
  --teal-dim:#158577;
  --red:#e5484d;
  --green:#2ecc71;
  --text-hi:#f4f1ea;
  --text-mid:#a8b3c7;
  --text-dim:#6b7690;
  --border:rgba(255,255,255,.08);
  --card-shadow: 0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:
  radial-gradient(circle at 15% 0%, rgba(255,121,0,.08), transparent 40%),
  radial-gradient(circle at 85% 100%, rgba(31,182,166,.06), transparent 40%),
  var(--navy-950);
  color:var(--text-hi); min-height:100vh;}
h1,h2,h3,h4{font-family:'Segoe UI',Roboto,Arial,sans-serif;margin:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--navy-600);border-radius:4px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}

/* ===== LOGIN ===== */
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,121,0,.12), transparent 45%),
    radial-gradient(circle at 82% 78%, rgba(31,182,166,.10), transparent 45%),
    linear-gradient(160deg,var(--navy-950),#050810);
  z-index:999;overflow:hidden}
@keyframes loginRise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.login-card{width:360px;max-width:92vw;background:var(--navy-800);border:1px solid var(--border);
  border-radius:18px;padding:32px 28px;box-shadow:var(--card-shadow), 0 0 80px rgba(245,166,35,.06);
  animation:loginRise .5s cubic-bezier(.16,1,.3,1)}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.login-logo .mark{width:auto;height:44px;border-radius:8px;background:#fff;padding:5px 8px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(255,121,0,.25), inset 0 1px 0 rgba(255,255,255,.25)}
.login-logo .mark img{height:100%;width:auto;display:block}
.login-logo .name{font-weight:700;font-size:19px;letter-spacing:.2px}
.login-logo .sub{font-size:11.5px;color:var(--text-dim)}
.login-card form{margin-top:22px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--text-mid)}
.field input,.field select{background:var(--navy-700);border:1px solid var(--border);color:var(--text-hi);
  border-radius:10px;padding:11px 12px;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,166,35,.15)}
.btn-primary{margin-top:6px;background:linear-gradient(135deg,var(--gold),var(--orange));border:none;
  color:#1a1200;font-weight:700;padding:12px;border-radius:10px;font-size:14.5px;
  box-shadow:0 6px 16px rgba(245,166,35,.3);transition:transform .1s,box-shadow .15s}
.btn-primary:hover{box-shadow:0 8px 22px rgba(245,166,35,.4)}
.btn-primary:active{transform:scale(.98)}
.login-error{color:var(--red);font-size:12.5px;min-height:16px}
.login-hint{margin-top:16px;font-size:11px;color:var(--text-dim);line-height:1.6;border-top:1px solid var(--border);padding-top:12px}
.login-hint b{color:var(--text-mid)}

/* ===== APP SHELL ===== */
#app{display:none;min-height:100vh}
#app.active{display:flex}

.sidebar{width:230px;flex-shrink:0;background:var(--navy-900);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid var(--border);margin-bottom:14px}
.sidebar .brand .mark{width:auto;height:34px;border-radius:8px;background:#fff;padding:4px 6px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(255,121,0,.25), inset 0 1px 0 rgba(255,255,255,.25)}
.sidebar .brand .mark img{height:100%;width:auto;display:block}
.sidebar .brand .txt div:first-child{font-weight:700;font-size:14.5px}
.sidebar .brand .txt div:last-child{font-size:10.5px;color:var(--text-dim)}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--text-mid);
  font-size:13.5px;font-weight:600;margin-bottom:3px;transition:background .15s,color .15s;border:none;background:none;
  width:100%;text-align:left}
.nav-item .ic{width:18px;text-align:center;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.nav-item:hover{background:var(--navy-800);color:var(--text-hi)}
.nav-item.active{background:linear-gradient(135deg,rgba(245,166,35,.18),rgba(255,121,0,.08));color:var(--gold-light);
  box-shadow:inset 3px 0 0 var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.nav-sep{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);padding:14px 12px 6px}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border)}
.user-chip{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px}
.user-chip .av{width:30px;height:30px;border-radius:50%;background:var(--navy-600);display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:12px;color:var(--gold-light);flex-shrink:0;overflow:hidden}
.user-chip .av img{width:100%;height:100%;object-fit:cover;display:block}
.table-av{width:32px;height:32px;border-radius:50%;background:var(--navy-600);display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:12px;color:var(--gold-light);overflow:hidden;flex-shrink:0}
.table-av img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-picker{display:flex;align-items:center;gap:14px}
.avatar-picker .preview{width:64px;height:64px;border-radius:50%;background:var(--navy-700);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:var(--gold-light);
  overflow:hidden;flex-shrink:0}
.avatar-picker .preview img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-picker .actions{display:flex;flex-direction:column;gap:6px}
.avatar-picker .actions input[type=file]{display:none}
.user-chip .info div:first-child{font-size:12.5px;font-weight:600}
.user-chip .info div:last-child{font-size:10.5px;color:var(--text-dim)}
.logout-btn{width:100%;margin-top:8px;background:none;border:1px solid var(--border);color:var(--text-mid);
  padding:8px;border-radius:9px;font-size:12px;font-weight:600}
.logout-btn:hover{color:var(--red);border-color:var(--red)}
.install-btn{display:none;width:100%;margin-top:8px;align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(135deg,var(--gold),var(--orange));border:none;color:#1a1200;
  padding:9px;border-radius:9px;font-size:12.5px;font-weight:700;box-shadow:0 4px 12px rgba(245,166,35,.25)}
.install-btn.show{display:flex}
.install-btn:hover{box-shadow:0 6px 16px rgba(245,166,35,.35)}
.install-ios-hint{display:none;margin-top:8px;padding:10px 11px;border-radius:9px;border:1px solid var(--border);
  background:rgba(255,255,255,.03);font-size:11.5px;color:var(--text-mid);line-height:1.5}
.install-ios-hint.show{display:block}
.install-ios-hint b{color:var(--text-hi)}
.install-ios-hint .ic-inline{display:inline-flex;vertical-align:-3px;margin:0 2px}

.main{flex:1;min-width:0;padding:22px 26px 60px;overflow-x:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.topbar-title-row{display:flex;align-items:center;gap:10px}
.topbar h1{font-size:21px;font-weight:700}
.topbar .breadcrumb{font-size:12px;color:var(--text-dim);margin-top:3px}
.topbar-actions{display:flex;gap:10px;align-items:center}
.badge-role{background:var(--navy-700);border:1px solid var(--border);color:var(--gold-light);font-size:11px;
  padding:5px 10px;border-radius:20px;font-weight:600}

.view{display:none}
.view.active{display:block}

/* ===== CARDS / KPI ===== */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi-card{background:linear-gradient(160deg,var(--navy-800),var(--navy-900));border:1px solid var(--border);
  border-radius:16px;padding:18px;box-shadow:var(--card-shadow);position:relative;overflow:hidden;
  transition:transform .18s ease,border-color .18s ease}
.kpi-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.16)}
.kpi-card::after{content:'';position:absolute;top:-30px;right:-30px;width:90px;height:90px;border-radius:50%;
  background:radial-gradient(circle,var(--accent,var(--gold)) 0%,transparent 70%);opacity:.15;transition:opacity .18s ease}
.kpi-card:hover::after{opacity:.26}
.kpi-card .lbl{font-size:12px;color:var(--text-mid);display:flex;align-items:center;gap:7px;margin-bottom:10px}
.kpi-card .lbl .ic{width:26px;height:26px;border-radius:8px;background:var(--navy-700);display:flex;
  align-items:center;justify-content:center;font-size:13px;color:var(--accent,var(--gold-light))}
.kpi-card .val{font-size:24px;font-weight:800;letter-spacing:-.3px}
.kpi-card .delta{font-size:11.5px;margin-top:6px;font-weight:600}
.delta.up{color:var(--green)}
.delta.down{color:var(--red)}
.delta.flat{color:var(--text-dim)}

.panel{background:var(--navy-800);border:1px solid var(--border);border-radius:16px;padding:20px;
  box-shadow:var(--card-shadow);margin-bottom:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.panel-head h3{font-size:15px;font-weight:700}
.panel-head .sub{font-size:11.5px;color:var(--text-dim);margin-top:2px}

.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media(max-width:1000px){.two-col{grid-template-columns:1fr}}

/* ===== BUTTONS ===== */
.btn{border:none;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;transition:transform .1s,filter .15s,box-shadow .15s;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--orange));color:#1a1200;
  box-shadow:0 4px 12px rgba(245,166,35,.28)}
.btn-gold:hover{filter:brightness(1.08);box-shadow:0 6px 18px rgba(245,166,35,.38)}
.btn-teal{background:linear-gradient(135deg,var(--teal),var(--teal-dim));color:#04241f;
  box-shadow:0 4px 12px rgba(31,182,166,.28)}
.btn-teal:hover{filter:brightness(1.08);box-shadow:0 6px 18px rgba(31,182,166,.38)}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text-mid)}
.btn-outline:hover{color:var(--text-hi);border-color:var(--text-mid)}
.btn-danger{background:rgba(229,72,77,.12);color:var(--red);border:1px solid rgba(229,72,77,.35)}
.btn-sm{padding:6px 11px;font-size:11.5px;border-radius:8px}
.btn-icon{width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--navy-700);border:1px solid var(--border);color:var(--text-mid)}
.btn-icon:hover{color:var(--text-hi)}

/* ===== TABLES ===== */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);
  padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text-mid);white-space:nowrap}
tbody tr:hover{background:rgba(255,255,255,.02)}
tbody td.strong{color:var(--text-hi);font-weight:600}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.pill-brouillon{background:rgba(107,118,144,.18);color:var(--text-mid)}
.pill-envoyee{background:rgba(245,166,35,.16);color:var(--gold-light)}
.pill-confirmee{background:rgba(31,182,166,.16);color:var(--teal)}
.pill-receptionnee{background:rgba(46,204,113,.16);color:var(--green)}
.pill-cloturee{background:rgba(168,179,199,.12);color:var(--text-dim)}
.pill-ok{background:rgba(46,204,113,.16);color:var(--green)}
.pill-warn{background:rgba(245,166,35,.16);color:var(--gold-light)}
.pill-danger{background:rgba(229,72,77,.16);color:var(--red)}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim)}
.empty-state .ic{font-size:34px;margin-bottom:10px}
.empty-state .msg{font-size:13px;max-width:340px;margin:0 auto}

/* ===== FORM / MODAL ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(5,8,15,.65);backdrop-filter:blur(2px);
  display:none;align-items:flex-start;justify-content:center;z-index:500;overflow-y:auto;padding:40px 16px}
.modal-backdrop.active{display:flex}
.modal{width:520px;max-width:100%;background:var(--navy-800);border:1px solid var(--border);border-radius:18px;
  padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal.wide{width:680px}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-head h3{font-size:16px}
.modal-close{background:none;border:none;color:var(--text-dim);font-size:20px;line-height:1}
.modal-close:hover{color:var(--text-hi)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.field textarea{resize:vertical;min-height:60px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* ===== ALERTS / TOASTS ===== */
#toastHost{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:10px;z-index:1000}
.toast{background:var(--navy-800);border:1px solid var(--border);border-left:4px solid var(--gold);
  padding:12px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:240px;
  animation:slideIn .2s ease}
.toast.success{border-left-color:var(--green)}
.toast.error{border-left-color:var(--red)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

.alert-box{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:12.5px;margin-bottom:10px}
.alert-danger{background:rgba(229,72,77,.1);border:1px solid rgba(229,72,77,.25);color:#ffb3b5}
.alert-warn{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.25);color:var(--gold-light)}

<script>
(function(){
  function resetAllApplicationData(){
    const ok = confirm(
      "⚠️ REMISE À ZÉRO COMPLÈTE\\n\\n" +
      "Cette action va supprimer toutes les données enregistrées dans ce dashboard " +
      "(opérations, registres, stocks, crédits, rapports et paramètres locaux).\\n\\n" +
      "Voulez-vous vraiment continuer ?"
    );
    if(!ok) return;
    const ok2 = confirm(
      "Dernière confirmation : toutes les données locales seront définitivement réinitialisées.\\n\\nContinuer ?"
    );
    if(!ok2) return;

    try{
      localStorage.clear();
      sessionStorage.clear();
    }catch(e){}

    alert("Toutes les données locales ont été remises à zéro. Le dashboard va être rechargé.");
    window.location.reload();
  }

  function addResetButton(){
    const candidates = [...document.querySelectorAll(
      '[id*="param" i],[class*="param" i],[id*="setting" i],[class*="setting" i]'
    )];
    let target = candidates.find(el => el.offsetParent !== null && el.children.length >= 0);

    if(!target){
      target = document.querySelector('main') || document.body;
    }

    if(document.getElementById('resetDataZone')) return;

    const zone=document.createElement('div');
    zone.id='resetDataZone';
    zone.className='reset-data-zone';
    zone.innerHTML=
      '<h3>⚠️ Zone de sécurité</h3>'+
      '<p>Remettre à zéro toutes les données enregistrées sur cet appareil.</p>'+
      '<button type="button" class="reset-all-data-btn" id="resetAllDataBtn">🗑️ Remettre toutes les données à zéro</button>';

    target.appendChild(zone);
    document.getElementById('resetAllDataBtn').addEventListener('click',resetAllApplicationData);
  }

  document.addEventListener('DOMContentLoaded',addResetButton);
  setTimeout(addResetButton,1200);
})();
</script>

/* =========================================================
   MPS DASHBOARD — Application de gestion Distributeur Orange Money
   Stockage : localStorage (mono-poste, sans backend)
   ========================================================= */

const DB_KEY = 'mps_db_v1';
const SESSION_KEY = 'mps_session_v1';

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function fmtGNF(n){ n = Math.round(n||0); return n.toLocaleString('fr-FR').replace(/,/g,' ') + ' GNF'; }
function fmtNum(n){ return Math.round(n||0).toLocaleString('fr-FR').replace(/,/g,' '); }
function fmtDate(d){ const dt = new Date(d); return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDateTime(d){ const dt = new Date(d); return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' · ' + dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Valide qu'un montant saisi est un nombre fini strictement positif (protège contre
// négatifs, zéro, NaN ou Infinity qui contourneraient les attributs HTML min/type=number).
function parsePositiveAmount(raw){
  const n = Number(raw);
  if(!Number.isFinite(n) || n <= 0) return null;
  return n;
}

// Filtre une liste par plage de dates (bornes incluses). dateStr : YYYY-MM-DD ou ISO complet.
// debut/fin : YYYY-MM-DD ou '' (pas de borne). Utilisé par les vues avec filtre de date.
function inDateRange(dateStr, debut, fin){
  const d = dateStr.slice(0,10);
  if(debut && d < debut) return false;
  if(fin && d > fin) return false;
  return true;
}
// Rendu HTML réutilisable des deux champs "Du / Au" pour un filtre de date, appelant
// setterExpr (ex. "ventesFilters.dateDebut=this.value; renderVentesView()") au changement.
function dateRangeFilterHtml(debut, fin, onDebutExpr, onFinExpr, onClearExpr){
  const hasFilter = debut || fin;
  return `
    <span class="date-sep">Du</span>
    <input type="date" value="${debut||''}" max="${fin||''}" onchange="${escapeHtml(onDebutExpr)}">
    <span class="date-sep">au</span>
    <input type="date" value="${fin||''}" min="${debut||''}" onchange="${escapeHtml(onFinExpr)}">
    ${hasFilter ? `<button type="button" class="btn-clear-filter" onclick="${escapeHtml(onClearExpr)}">Effacer les dates</button>` : ''}`;
}

// Hachage des mots de passe (SHA-256 via Web Crypto). Non réversible côté client.
// Note : sans backend, ceci protège contre la lecture directe (export JSON, localStorage,
// épaule regardant l'écran) mais pas contre un attaquant qui modifierait le code lui-même —
// une vraie protection nécessiterait une authentification côté serveur.
async function hashPassword(plain){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mps_salt_v1::'+plain));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// Redimensionne/compresse une image uploadée (photo de profil) en carré JPEG base64
// pour limiter l'empreinte sur le localStorage (mono-poste, quota limité).
const PHOTO_MAX_SOURCE_BYTES = 5 * 1024 * 1024; // 5 Mo max pour le fichier source avant traitement
function resizeImageToDataURL(file, maxSize=200, quality=0.82){
  return new Promise((resolve, reject)=>{
    if(!file.type.startsWith('image/')){ reject(new Error('Le fichier sélectionné n\'est pas une image.')); return; }
    if(file.size > PHOTO_MAX_SOURCE_BYTES){ reject(new Error(`Image trop volumineuse (${(file.size/1024/1024).toFixed(1)} Mo). Taille maximale : 5 Mo.`)); return; }
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Lecture du fichier impossible.'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Image invalide.'));
      img.onload = ()=>{
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side)/2, sy = (img.height - side)/2;
        const canvas = document.createElement('canvas');
        canvas.width = maxSize; canvas.height = maxSize;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, side, side, 0, 0, maxSize, maxSize);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Migration douce : ajoute les nouvelles collections aux bases déjà sauvegardées (v1/v2/v3)
async function migrateDB(){
  let changed = false;
  if(!DB.creditsClients){ DB.creditsClients = []; changed = true; }
  if(!DB.avances){ DB.avances = []; changed = true; }
  if(!DB.retours){ DB.retours = []; changed = true; }
  if(!DB.stockERechargeLivre){ DB.stockERechargeLivre = []; changed = true; }
  if(DB.settings && DB.settings.lastBackupDate === undefined){ DB.settings.lastBackupDate = null; changed = true; }
  if(DB.version < 4){
    for(const u of DB.users){
      if(u.motdepasse && !u.passHash){ u.passHash = await hashPassword(u.motdepasse); delete u.motdepasse; changed = true; }
    }
    DB.version = 4; changed = true;
  }
  if(DB.version < 5){
    // Force le changement de mot de passe pour les comptes qui utilisent
    // encore un mot de passe par défaut connu (admin123, direction123,
    // agence123, finance123, agent123). Un compte dont le mot de passe a déjà
    // été personnalisé n'est pas concerné : on ne l'embête pas inutilement.
    const defaultHashes = await Promise.all(
      ['admin123','direction123','agence123','finance123','agent123'].map(hashPassword)
    );
    for(const u of DB.users){
      if(u.mustChangePassword === undefined){
        u.mustChangePassword = defaultHashes.includes(u.passHash);
        changed = true;
      }
    }
    DB.version = 5; changed = true;
  }
  if(changed){ saveDB(); }
}

let DB = null;

/* ---- Firestore sync (offline-first) --------------------------------------
   The whole DB blob is mirrored as one document (mps/db) in Firestore.
   Firestore's persistentLocalCache means every read/write below resolves
   instantly against the local IndexedDB cache, whether or not the device is
   online; sync to the server happens in the background automatically.
   localStorage remains a secondary fallback (used only if Firebase never
   becomes available, e.g. blocked by firewall/ad-blocker). ---------------- */
let fbUnsub = null;
let fbApplyingRemote = false; // guard against re-saving a snapshot we just received
const FB_WAIT_MS = 6000;

function waitForFirebase(){
  return new Promise(resolve=>{
    if(window.__firebase){ resolve(true); return; }
    let done = false;
    const onReady = ()=>{ if(done) return; done = true; resolve(true); };
    window.addEventListener('firebase-ready', onReady, { once:true });
    setTimeout(()=>{ if(done) return; done = true; resolve(false); }, FB_WAIT_MS);
  });
}

function setSyncStatus(state){
  // state: 'synced' | 'syncing' | 'offline' | 'local-only'
  window.__syncState = state;
  const el = document.getElementById('syncIndicator');
  if(!el) return;
  const labels = {
    synced:   { dot:'var(--green)', text:'Synchronisé' },
    syncing:  { dot:'var(--gold)',  text:'Synchronisation…' },
    offline:  { dot:'var(--red)',   text:'Hors ligne (en attente de sync)' },
    'local-only': { dot:'var(--text-dim)', text:'Stockage local uniquement' },
  };
  const s = labels[state] || labels['local-only'];
  el.innerHTML = `<span style="width:8px;height:8px;border-radius:50%;background:${s.dot};display:inline-block;flex-shrink:0"></span><span>${s.text}</span>`;
}

async function loadDB(){
  // Démarrage local immédiat : l'ouverture de l'application ne doit jamais
  // dépendre d'Internet ou d'une réponse Firestore.
  const raw = localStorage.getItem(DB_KEY);
  if(raw){
    try{ DB = JSON.parse(raw); await migrateDB(); }
    catch(e){ DB = seedDB(); }
  } else {
    // Démarrage propre : aucune donnée de démonstration.
    DB = emptyDB();
    for(const u of DB.users){ u.passHash = await hashPassword(u.motdepasse); delete u.motdepasse; }
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
  }
  setSyncStatus('local-only');

  // Synchronisation distante en arrière-plan, sans bloquer l'affichage/login.
  setTimeout(syncFirebaseInBackground, 0);
}

async function syncFirebaseInBackground(){
  const hasFirebase = await waitForFirebase();
  if(!hasFirebase || !window.__firebase) return;
  try{
    const { DB_DOC, getDoc, setDoc, onSnapshot } = window.__firebase;
    const timeout = new Promise((_, reject)=>setTimeout(()=>reject(new Error('timeout')), 5000));
    const snap = await Promise.race([getDoc(DB_DOC), timeout]);
    if(snap.exists()){
      try{
        const remote = JSON.parse(snap.data().json);
        DB = remote;
        await migrateDB();
        localStorage.setItem(DB_KEY, JSON.stringify(DB));
        setSyncStatus(navigator.onLine ? 'synced' : 'offline');
        if(document.getElementById('app')?.classList.contains('active')){
          renderSidebar(); renderView();
        }
      }catch(e){ console.warn('Snapshot Firestore invalide :', e); }
    } else {
      await Promise.race([
        setDoc(DB_DOC, { json: JSON.stringify(DB), updatedAt: Date.now() }),
        new Promise((_, reject)=>setTimeout(()=>reject(new Error('timeout')), 5000))
      ]);
      setSyncStatus(navigator.onLine ? 'synced' : 'offline');
    }

    if(fbUnsub) fbUnsub();
    fbUnsub = onSnapshot(DB_DOC, { includeMetadataChanges:true }, (snap)=>{
      if(!snap.exists()) return;
      setSyncStatus(snap.metadata.hasPendingWrites ? 'syncing' : (navigator.onLine ? 'synced' : 'offline'));
      if(snap.metadata.hasPendingWrites) return;
      try{
        const remote = JSON.parse(snap.data().json);
        fbApplyingRemote = true;
        DB = remote;
        localStorage.setItem(DB_KEY, JSON.stringify(DB));
        if(document.getElementById('app')?.classList.contains('active')){
          renderSidebar(); renderView();
        }
      }catch(e){ console.warn('Échec application snapshot distant :', e); }
      finally{ fbApplyingRemote = false; }
    }, (err)=>{ console.warn('Erreur de synchronisation Firestore :', err); setSyncStatus('offline'); });

    window.addEventListener('online', ()=>setSyncStatus('syncing'));
    window.addEventListener('offline', ()=>setSyncStatus('offline'));
  }catch(e){
    console.warn('Firestore indisponible : l application continue en mode local.', e);
    setSyncStatus('local-only');
  }
}

function saveDB(){
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
  if(fbApplyingRemote) return Promise.resolve();
  if(window.__firebase){
    setSyncStatus(navigator.onLine ? 'syncing' : 'offline');
    const { DB_DOC, setDoc } = window.__firebase;
    return setDoc(DB_DOC, { json: JSON.stringify(DB), updatedAt: Date.now() }).catch(e=>{
      console.warn('Échec écriture Firestore (restera en file d\'attente locale) :', e);
    });
  }
  return Promise.resolve();
}

let SESSION = null;
function loadSession(){
  const raw = sessionStorage.getItem(SESSION_KEY);
  if(raw){ try{ SESSION = JSON.parse(raw); }catch(e){ SESSION = null; } }
}
function saveSession(){ sessionStorage.setItem(SESSION_KEY, JSON.stringify(SESSION)); }
function clearSession(){ sessionStorage.removeItem(SESSION_KEY); SESSION = null; }

function currentUser(){ return DB.users.find(u=>u.id===SESSION.userId); }
function isRole(...roles){ return roles.includes(currentUser().role); }

function logActivity(texte){
  DB.activityLog.unshift({ date: nowISO(), texte, user: SESSION.userId });
  DB.activityLog = DB.activityLog.slice(0,200);
}

function toast(msg, type){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3200);
}

  if(item.sep) return true;
  if(item.roles==='all') return true;
  return item.roles.includes(currentUser().role);
}

function goTo(viewId){
  // Revalide l'accès même si goTo() est appelé directement (ex. console du
  // navigateur) et pas seulement via un clic sur un item de menu déjà filtré
  // par canSee(). Sans ce garde-fou, un item masqué dans le menu restait
  // néanmoins accessible en appelant goTo('utilisateurs') ou goTo('parametres').
  const item = NAV_ITEMS.find(n=>n.id===viewId);
  if(item && !canSee(item)){
    toast("Vous n'avez pas accès à cette section.", 'error');
    return;
  }
  currentView = viewId;
  closeSidebar();
  renderSidebar();
  renderView();
}

function renderView(){
  // Deuxième couche de vérification (en plus de goTo()) : si currentView
  // pointe vers une section non autorisée pour le rôle courant — quelle que
  // soit la façon dont on y est arrivé — on retombe sur le tableau de bord
  // plutôt que d'afficher la vue. Défense en profondeur : renderView() est
  // le point unique qui décide réellement ce qui s'affiche à l'écran.
  const navItem = NAV_ITEMS.find(n=>n.id===currentView);
  if(navItem && !canSee(navItem)){
    currentView = 'dashboard';
    renderSidebar();
  }
  const meta = VIEW_META[currentView];
  document.getElementById('viewTitle').textContent = meta.title;
  document.getElementById('viewBreadcrumb').textContent = meta.crumb;
  const host = document.getElementById('viewsHost');
  const renderers = {
    dashboard: renderDashboardView,
    commandes: renderCommandesView,

    retours: renderRetoursView,
    credit: renderCreditView,
    rapports: renderRapportsView,
    utilisateurs: renderUtilisateursView,
    parametres: renderParametresView,
  };
  host.innerHTML = '';
  (renderers[currentView] || (()=>{host.innerHTML='<div class="panel">Vue introuvable.</div>';}))();
}

function agenceName(id){ if(id==='central') return 'Central (MPS)'; const a=DB.agences.find(x=>x.id===id); return a?a.nom:id; }
function pdvName(id){ const p=DB.pdvs.find(x=>x.id===id); return p?p.nom:id; }
function pdvsOfAgence(agId){ return DB.pdvs.filter(p=>p.agenceId===agId); }
function nodeLabel(id){ if(id==='central') return 'Central'; if(DB.agences.find(a=>a.id===id)) return agenceName(id); return pdvName(id); }

// Portée visible selon le rôle : Administrateur/Direction/Comptable voient tout ;
// Responsable Agence voit son agence + ses PDV ; Agent PDV voit uniquement son PDV.
function visibleAgenceIds(){
  const u = currentUser();
  if(['Administrateur','Direction','Comptable'].includes(u.role)) return DB.agences.map(a=>a.id);
  if(u.role==='Responsable Agence') return [u.agenceId];
  if(u.role==='Agent PDV') return [u.agenceId];
  return DB.agences.map(a=>a.id);
}
function visiblePdvIds(){
  const u = currentUser();
  if(['Administrateur','Direction','Comptable'].includes(u.role)) return DB.pdvs.map(p=>p.id);
  if(u.role==='Responsable Agence') return pdvsOfAgence(u.agenceId).map(p=>p.id);
  if(u.role==='Agent PDV') return [u.pdvId];
  return DB.pdvs.map(p=>p.id);
}

function totalStockFloat(scope){ // scope: 'all' | 'central' | agenceId | pdvId
  if(scope==='all'){
    let t = DB.stockFloat.central||0;
    DB.agences.forEach(a=>t+=DB.stockFloat[a.id]||0);
    DB.pdvs.forEach(p=>t+=DB.stockFloat[p.id]||0);
    return t;
  }
  return DB.stockFloat[scope]||0;
}
function totalStockRecharge(scope){
  if(scope==='all'){
    let t = DB.stockRecharge.central||0;
    DB.agences.forEach(a=>t+=DB.stockRecharge[a.id]||0);
    DB.pdvs.forEach(p=>t+=DB.stockRecharge[p.id]||0);
    return t;
  }
  return DB.stockRecharge[scope]||0;
}
function scopedTotalFloat(){
  const ids = isRole('Administrateur','Direction','Comptable') ? ['central',...visibleAgenceIds(),...visiblePdvIds()] : [...visibleAgenceIds(),...visiblePdvIds()];
  return ids.reduce((s,id)=>s+(DB.stockFloat[id]||0),0);
}
function scopedTotalRecharge(){
  const ids = isRole('Administrateur','Direction','Comptable') ? ['central',...visibleAgenceIds(),...visiblePdvIds()] : [...visibleAgenceIds(),...visiblePdvIds()];
  return ids.reduce((s,id)=>s+(DB.stockRecharge[id]||0),0);
}

function ventesOfDay(dateISO, list){
  return (list||DB.ventes).filter(v=> v.date.slice(0,10)===dateISO );
}
function isInScopePdv(pdvId){ return visiblePdvIds().includes(pdvId); }
function isInScopeAgence(agId){ return visibleAgenceIds().includes(agId); }

function lowStockAlerts(){
  const alerts = [];
  const seuilF = DB.settings.alerteFloatSeuil, seuilR = DB.settings.alerteRechargeSeuil;

  // Stock float bas (agences + PDV)
  DB.agences.filter(a=>isInScopeAgence(a.id)).forEach(a=>{
    const val = DB.stockFloat[a.id]||0;
    if(val < seuilF) alerts.push({type:'float', gravite: val<=0?'critique':'warn', label:agenceName(a.id), val, msg:`Stock float bas : ${fmtGNF(val)}`});
  });
  DB.pdvs.filter(p=>isInScopePdv(p.id)).forEach(p=>{
    const valF = DB.stockFloat[p.id]||0;
    if(valF < seuilF) alerts.push({type:'float', gravite: valF<=0?'critique':'warn', label:pdvName(p.id), val:valF, msg:`Stock float bas : ${fmtGNF(valF)}`});
    const valR = DB.stockRecharge[p.id]||0;
    if(valR < seuilR) alerts.push({type:'recharge', gravite: valR<=0?'critique':'warn', label:pdvName(p.id), val:valR, msg:`Stock e-recharge bas : ${fmtNum(valR)} unités`});
  });

  // Échéances OFMG en retard ou imminentes (visible pour Administrateur/Direction/Comptable uniquement)
  if(isRole('Administrateur','Direction','Comptable')){
    const today = new Date(todayISO());
    (DB.creditOFMG.echeances||[]).forEach(ech=>{
      if(ech.statut==='Soldée') return;
      const dEch = new Date(ech.dateEcheance);
      const joursRestants = Math.round((dEch-today)/86400000);
      if(ech.statut==='En retard' || joursRestants<0){
        alerts.push({type:'echeance', gravite:'critique', label:'Échéance OFMG', val:ech.montant, msg:`Échéance en retard (${fmtGNF(ech.montant)}) — ${escapeHtml(ech.note||'')}`});
      } else if(joursRestants<=3){
        alerts.push({type:'echeance', gravite:'warn', label:'Échéance OFMG', val:ech.montant, msg:`Échéance dans ${joursRestants} jour(s) (${fmtGNF(ech.montant)}) — ${escapeHtml(ech.note||'')}`});
      }
    });
  }

  // Sauvegarde des données : rappel si jamais exportée ou trop ancienne (Administrateur/Direction uniquement)
  if(isRole('Administrateur','Direction')){
    const days = daysSinceBackup();
    if(days===null){
      alerts.push({type:'backup', gravite:'warn', label:'Sauvegarde', val:0, msg:"Aucune sauvegarde exportée pour l'instant — pensez à en faire une dans Paramètres."});
    } else if(days>14){
      alerts.push({type:'backup', gravite:'critique', label:'Sauvegarde', val:days, msg:`Dernière sauvegarde il y a ${days} jours — exportez vos données dans Paramètres.`});
    } else if(days>7){
      alerts.push({type:'backup', gravite:'warn', label:'Sauvegarde', val:days, msg:`Dernière sauvegarde il y a ${days} jours — pensez à en refaire une.`});
    }
  }

  // Tri par gravité (critique d'abord)
  return alerts.sort((a,b)=> (a.gravite==='critique'?0:1) - (b.gravite==='critique'?0:1));
}

function topPdvByVolume(days){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days);
  const totals = {};
  DB.ventes.filter(v=>new Date(v.date)>=cutoff && isInScopePdv(v.refId)).forEach(v=>{
    totals[v.refId] = (totals[v.refId]||0) + v.montant;
  });
  return Object.entries(totals).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,val])=>({id, nom:pdvName(id), val}));
}

let chart1=null, chart2=null;
function drawVentes7jChart(){
  const ctx = document.getElementById('chartVentes7j');

    }}
  });

function advanceCommande(cmdId){
  const c = DB.commandes.find(x=>x.id===cmdId);
  const idx = STATUT_ORDER.indexOf(c.statut);
  const next = STATUT_ORDER[idx+1];
  if(!next) return;
  c.statut = next;
  c.historiqueStatut.push({statut:next, date: nowISO()});

  if(next==='Réceptionnée'){
    // mise à jour auto stock central + crédit fournisseur
    DB.stockFloat.central = (DB.stockFloat.central||0) + c.montant;
    DB.creditOFMG.solde += c.montant;
    DB.creditOFMG.mouvements.unshift({ id: uid('CR'), type:'augmentation', montant:c.montant, date: nowISO(), reference:c.reference, note:'Réception commande' });
    logActivity(`Commande ${c.reference} réceptionnée — stock float +${fmtGNF(c.montant)}, crédit OFMG mis à jour`);
    toast('Stock float et crédit OFMG mis à jour automatiquement','success');
  } else {
    logActivity(`Commande ${c.reference} passée au statut « ${next} »`);
  }
  saveDB(); closeModal(); renderCommandesView(); toast(`Statut mis à jour : ${next}`,'success');
}

/* =========================================================
   VUE : STOCK E-RECHARGE — RÉSEAU PDV
   ========================================================= */
// Reconstruit un historique chronologique d'entrées/sorties de stock e-recharge
// (en unités/paquets) pour un nœud donné : 'central', un id d'agence, ou un id de PDV.
// Puise dans les sources déjà existantes plutôt que de dupliquer un journal séparé :
//   - Achats Orange GN            -> entrée sur 'central'
//   - Transferts validés/annulés  -> sortie sur la source, entrée sur la destination
//   - Conversions Dual Wallet     -> entrée sur le PDV concerné
//   - Ventes e-recharge           -> sortie sur le PDV concerné (annulée si vente supprimée/reversée)
function getStockRechargeMouvements(scope){
  const mvts = [];

  if(scope === 'central'){
    DB.stockERechargeLivre.forEach(m=>{
      if(m.type === 'entree'){
        mvts.push({ date: m.date, sens:'entree', montant: m.paquets, libelle: m.libelle || 'Achat Orange GN', source: 'Achat E-Recharge' });
      }
    });
  }

  DB.transferts.forEach(t=>{
    if(t.type !== 'e-recharge') return;
    if(t.statut === 'Annulé') return; // soldes déjà restaurés, aucun mouvement net à afficher
    if(t.de === scope) mvts.push({ date: t.date, sens:'sortie', montant: t.montant, libelle: `Transfert vers ${nodeLabel(t.vers)}`, source: 'Transfert' });
    if(t.vers === scope) mvts.push({ date: t.date, sens:'entree', montant: t.montant, libelle: `Transfert depuis ${nodeLabel(t.de)}`, source: 'Transfert' });
  });

  DB.conversions.forEach(c=>{
    if(c.pdvId === scope) mvts.push({ date: c.date, sens:'entree', montant: c.montantRecharge, libelle: 'Conversion Dual Wallet (Float → E-Recharge)', source: 'Dual Wallet' });
  });

  DB.ventes.forEach(v=>{
    if(v.type === 'e-recharge' && v.refId === scope) mvts.push({ date: v.date, sens:'sortie', montant: v.montant, libelle: 'Vente e-recharge client', source: 'Vente' });
  });

  mvts.sort((a,b)=> new Date(a.date) - new Date(b.date));
  let solde = 0;
  mvts.forEach(m=>{ solde += (m.sens==='entree'? m.montant : -m.montant); m.solde = solde; });
  return mvts;
}

function stockRechargeNodeOptions(){
  const groups = [];
  if(isRole('Administrateur','Direction','Comptable')) groups.push(`<option value="central">Central (MPS)</option>`);
  const agGroup = DB.agences.filter(a=>isInScopeAgence(a.id)).map(a=>`<option value="${a.id}">${escapeHtml(a.nom)}</option>`).join('');
  if(agGroup) groups.push(`<optgroup label="Agences">${agGroup}</optgroup>`);
  const pdvGroup = DB.pdvs.filter(p=>isInScopePdv(p.id)).map(p=>`<option value="${p.id}">${escapeHtml(p.nom)}</option>`).join('');
  if(pdvGroup) groups.push(`<optgroup label="Points de vente">${pdvGroup}</optgroup>`);
  return groups.join('');
}

        <div class="field"><label>Localisation</label><input type="text" id="agLoc" value="${existing?escapeHtml(existing.localisation):''}" required></div>
        <div class="field full"><label>Plafond float (GNF)</label><input type="number" id="agPlafond" min="0" value="${existing?existing.plafondFloat:''}" required></div>
      </div>

      </div>
    </form>`);
  document.getElementById('agForm').addEventListener('submit', e=>{
    e.preventDefault();
    const nom = document.getElementById('agNom').value.trim();
    if(existing){
      existing.nom = nom; existing.responsable = document.getElementById('agResp').value.trim();
      existing.localisation = document.getElementById('agLoc').value.trim(); existing.plafondFloat = Math.max(0, Number(document.getElementById('agPlafond').value)||0);
      logActivity(`Agence modifiée : ${nom}`);
      saveDB(); closeModal(); renderAgencesView(); toast('Agence mise à jour','success');
    } else {
      const id = uid('AG');
      DB.agences.push({ id, nom, responsable: document.getElementById('agResp').value.trim(),
        localisation: document.getElementById('agLoc').value.trim(), plafondFloat: Math.max(0, Number(document.getElementById('agPlafond').value)||0) });
      DB.stockFloat[id] = 0; DB.stockRecharge[id] = 0;
      logActivity(`Nouvelle agence créée : ${nom}`);
      saveDB(); closeModal(); renderAgencesView(); toast('Agence créée','success');
    }
  });
}

function deleteAgence(id){
  const a = DB.agences.find(x=>x.id===id);
  if(!a) return;
  const pdvs = pdvsOfAgence(id);
  if(pdvs.length){ toast(`Impossible : ${pdvs.length} PDV encore rattaché(s) à cette agence.`,'error'); return; }
  const solde = (DB.stockFloat[id]||0) + (DB.stockRecharge[id]||0);
  if(solde > 0){ toast('Impossible : cette agence a encore du stock (float ou e-recharge) non nul.','error'); return; }
  if(!confirm(`Supprimer définitivement l'agence « ${a.nom} » ? Cette action est irréversible.`)) return;
  DB.agences = DB.agences.filter(x=>x.id!==id);
  delete DB.stockFloat[id]; delete DB.stockRecharge[id];
  logActivity(`Agence supprimée : ${a.nom}`);
  saveDB(); renderAgencesView(); toast('Agence supprimée','success');
}

function deletePdv(id){
  const p = DB.pdvs.find(x=>x.id===id);
  if(!p) return;
  const solde = (DB.stockFloat[id]||0) + (DB.stockRecharge[id]||0);
  if(solde > 0){ toast('Impossible : ce PDV a encore du stock (float ou e-recharge) non nul.','error'); return; }
  const hasVentes = DB.ventes.some(v=>v.refId===id);
  if(hasVentes && !confirm(`Ce PDV a un historique de ventes. Supprimer « ${p.nom} » quand même ? L'historique sera conservé mais le PDV n'apparaîtra plus.`)) return;
  if(!hasVentes && !confirm(`Supprimer définitivement le PDV « ${p.nom} » ?`)) return;
  DB.pdvs = DB.pdvs.filter(x=>x.id!==id);
  delete DB.stockFloat[id]; delete DB.stockRecharge[id];
  logActivity(`PDV supprimé : ${p.nom}`);
  saveDB(); renderAgencesView(); toast('PDV supprimé','success');
}

let comparatifPeriode = '30';

function comparatifAgenceStats(agId, days){
  const pdvIds = pdvsOfAgence(agId).map(p=>p.id);
  const floatActuel = (DB.stockFloat[agId]||0) + pdvIds.reduce((s,id)=>s+(DB.stockFloat[id]||0),0);
  const rechargeActuel = (DB.stockRecharge[agId]||0) + pdvIds.reduce((s,id)=>s+(DB.stockRecharge[id]||0),0);
  let ventesPeriode = 0;
  if(days){
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-Number(days));
    DB.ventes.filter(v=>new Date(v.date)>=cutoff && pdvIds.includes(v.refId)).forEach(v=>{ ventesPeriode += v.montant; });
  } else {
    DB.ventes.filter(v=>pdvIds.includes(v.refId)).forEach(v=>{ ventesPeriode += v.montant; });
  }
  return { agId, nom: agenceName(agId), floatActuel, rechargeActuel, ventesPeriode, nbPdv: pdvIds.length };
}

  document.getElementById('topbarActions').innerHTML = '';

  const stats = ags.map(a=>comparatifAgenceStats(a.id, comparatifPeriode)).sort((a,b)=>b.ventesPeriode-a.ventesPeriode);
  const max = Math.max(1, ...stats.map(s=>s.ventesPeriode));

  host.innerHTML = `

          <tbody>
            ${stats.map(s=>`
              <tr>
                <td class="strong">${escapeHtml(s.nom)}</td>

          </tbody>
        </table>` : `<div style="color:var(--text-dim);font-size:13px;padding:8px 0">Aucune donnée.</div>`}

  DB.agences.filter(a=>isInScopeAgence(a.id)).forEach(a=>opts.push({id:a.id, label:a.nom}));
  DB.pdvs.filter(p=>isInScopePdv(p.id)).forEach(p=>opts.push({id:p.id, label:'↳ '+p.nom}));
  return opts;
}

        </div>

        <div class="field"><label>De</label><select id="trDe">${nodes.map(n=>`<option value="${n.id}">${escapeHtml(n.label)}</option>`).join('')}</select></div>
        <div class="field"><label>Vers</label><select id="trVers">${nodes.map(n=>`<option value="${n.id}">${escapeHtml(n.label)}</option>`).join('')}</select></div>
      </div>
      <div class="login-error" id="trError"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn btn-gold">Valider le transfert</button>
      </div>
    </form>`);
  document.getElementById('trForm').addEventListener('submit', e=>{
    e.preventDefault();
    const type = document.getElementById('trType').value;
    const montant = parsePositiveAmount(document.getElementById('trMontant').value);
    const de = document.getElementById('trDe').value;
    const vers = document.getElementById('trVers').value;
    const err = document.getElementById('trError');
    if(montant===null){ err.textContent = 'Le montant doit être un nombre positif.'; return; }
    if(de===vers){ err.textContent = 'La source et la destination doivent être différentes.'; return; }
    const stockObj = type==='float' ? DB.stockFloat : DB.stockRecharge;
    const solde = stockObj[de]||0;
    if(solde < montant){ err.textContent = `Solde insuffisant sur ${nodeLabel(de)} (disponible : ${type==='float'?fmtGNF(solde):fmtNum(solde)+' unités'}).`; return; }
    stockObj[de] = solde - montant;
    stockObj[vers] = (stockObj[vers]||0) + montant;
    const tr = { id: uid('TR'), type, de, vers, montant, date: nowISO(), statut:'Validé', par: SESSION.userId };
    DB.transferts.unshift(tr);
    logActivity(`Transfert ${type==='float'?'float':'e-recharge'} de ${nodeLabel(de)} vers ${nodeLabel(vers)} (${type==='float'?fmtGNF(montant):fmtNum(montant)+' unités'})`);
    saveDB(); closeModal(); renderTransfertsView(); toast('Transfert validé et tracé','success');
  });
}

function annulerTransfert(id){
  if(!isRole('Administrateur','Direction')){
    toast("Vous n'avez pas l'autorisation d'annuler un transfert.", 'error');
    return;
  }
  const t = DB.transferts.find(x=>x.id===id);
  if(!t) return;
  const stockObj = t.type==='float' ? DB.stockFloat : DB.stockRecharge;
  const soldeVers = stockObj[t.vers]||0;
  if(soldeVers < t.montant){ toast(`Annulation impossible : ${nodeLabel(t.vers)} ne dispose plus du solde suffisant pour reverser ce transfert.`,'error'); return; }
  if(!confirm(`Annuler ce transfert de ${nodeLabel(t.de)} vers ${nodeLabel(t.vers)} (${t.type==='float'?fmtGNF(t.montant):fmtNum(t.montant)+' unités'}) ? Les soldes seront restaurés.`)) return;
  stockObj[t.vers] = soldeVers - t.montant;
  stockObj[t.de] = (stockObj[t.de]||0) + t.montant;
  t.statut = 'Annulé';
  logActivity(`Transfert annulé : ${nodeLabel(t.de)} → ${nodeLabel(t.vers)} (${t.type==='float'?fmtGNF(t.montant):fmtNum(t.montant)+' unités'})`);
  saveDB(); renderTransfertsView(); toast('Transfert annulé, soldes restaurés','success');
}

function openConversionModal(){
  const pdvs = DB.pdvs.filter(p=>isInScopePdv(p.id));
  // Seuls Admin/Direction peuvent définir un taux différent du taux officiel
  // (DB.settings.tauxCommissionDualWallet). Un Agent PDV ou Responsable Agence
  // voit le taux appliqué mais ne peut pas le modifier : cela évite qu'un
  // agent s'attribue une commission plus favorable que celle fixée par la
  // direction. Le champ est affiché en lecture seule pour ces rôles.
  const canEditTaux = isRole('Administrateur','Direction');
  openModal(`
    <div class="modal-head"><h3>Nouvelle conversion Dual Wallet</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <form id="dwForm">
      <div class="form-grid">
        <div class="field full"><label>PDV</label><select id="dwPdv">${pdvs.map(p=>`<option value="${p.id}">${escapeHtml(p.nom)} — float dispo. ${fmtGNF(DB.stockFloat[p.id]||0)}</option>`).join('')}</select></div>
        <div class="field"><label>Montant float à convertir (GNF)</label><input type="number" id="dwMontant" min="1" required></div>
        <div class="field"><label>Taux de commission (%)</label><input type="number" id="dwTaux" step="0.1" value="${DB.settings.tauxCommissionDualWallet}" ${canEditTaux?'':'readonly title="Seuls Admin/Direction peuvent modifier le taux."'} required></div>
      </div>
      <div id="dwPreview" style="margin-top:14px;font-size:12.5px;color:var(--text-mid)"></div>
      <div class="login-error" id="dwError"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn btn-gold">Enregistrer la conversion</button>
      </div>
    </form>`);
  const updatePreview = ()=>{
    const m = Number(document.getElementById('dwMontant').value)||0;
    const t = Number(document.getElementById('dwTaux').value)||0;
    const commission = Math.round(m*t/100);
    document.getElementById('dwPreview').innerHTML = `Commission : <b style="color:var(--gold-light)">${fmtGNF(commission)}</b> · E‑recharge crédité : <b style="color:var(--text-hi)">${fmtGNF(m-commission)}</b>`;
  };
  document.getElementById('dwMontant').addEventListener('input', updatePreview);
  document.getElementById('dwTaux').addEventListener('input', updatePreview);
  document.getElementById('dwForm').addEventListener('submit', e=>{
    e.preventDefault();
    const pdvId = document.getElementById('dwPdv').value;
    const montant = parsePositiveAmount(document.getElementById('dwMontant').value);
    // Si le rôle n'a pas le droit d'éditer le taux, on ignore toute valeur
    // envoyée par le formulaire et on force le taux officiel — protège aussi
    // contre une modification du DOM (readonly retiré via devtools).
    const taux = canEditTaux ? Number(document.getElementById('dwTaux').value) : DB.settings.tauxCommissionDualWallet;
    const err = document.getElementById('dwError');
    if(montant===null){ err.textContent = 'Le montant doit être un nombre positif.'; return; }
    if(!Number.isFinite(taux) || taux < 0 || taux > 100){ err.textContent = 'Le taux de commission doit être compris entre 0 et 100%.'; return; }
    const solde = DB.stockFloat[pdvId]||0;
    if(solde < montant){ err.textContent = `Solde float insuffisant pour ${pdvName(pdvId)} (disponible : ${fmtGNF(solde)}).`; return; }
    const commission = Math.round(montant*taux/100);
    const montantRecharge = montant - commission;
    DB.stockFloat[pdvId] = solde - montant;
    DB.stockRecharge[pdvId] = (DB.stockRecharge[pdvId]||0) + montantRecharge;
    DB.conversions.unshift({ id: uid('DW'), pdvId, montantFloat: montant, tauxCommission: taux, commission, montantRecharge, date: nowISO() });
    logActivity(`Conversion Dual Wallet — ${pdvName(pdvId)} : ${fmtGNF(montant)} float → ${fmtGNF(montantRecharge)} e-recharge (commission ${fmtGNF(commission)})`);
    saveDB(); closeModal(); renderDualWalletView(); toast('Conversion enregistrée','success');
  });
}

function reverseVenteEffect(v){
  if(v.type==='e-recharge') DB.stockRecharge[v.refId] = (DB.stockRecharge[v.refId]||0) + v.montant;
  else if(v.type==='retrait') DB.stockFloat[v.refId] = (DB.stockFloat[v.refId]||0) + v.montant;
  else if(v.type==='depot') DB.stockFloat[v.refId] = (DB.stockFloat[v.refId]||0) - v.montant;
}
function applyVenteEffect(pdvId, type, montant){
  if(type==='e-recharge'){
    if((DB.stockRecharge[pdvId]||0) < montant) return `Stock e-recharge insuffisant pour ${pdvName(pdvId)}.`;
    DB.stockRecharge[pdvId] -= montant;
  } else if(type==='retrait'){
    if((DB.stockFloat[pdvId]||0) < montant) return `Stock float insuffisant pour ${pdvName(pdvId)} pour ce retrait.`;
    DB.stockFloat[pdvId] -= montant;
  } else if(type==='depot'){
    DB.stockFloat[pdvId] = (DB.stockFloat[pdvId]||0) + montant;
  }
  return null;
}

function openVenteModal(id){
  const existing = id ? DB.ventes.find(v=>v.id===id) : null;
  const pdvs = DB.pdvs.filter(p=>isInScopePdv(p.id));
  openModal(`
    <div class="modal-head"><h3>${existing?'Modifier la vente / mouvement':'Nouvelle vente / mouvement'}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <form id="vtForm">
      <div class="form-grid">
        <div class="field full"><label>PDV</label><select id="vtPdv">${pdvs.map(p=>`<option value="${p.id}" ${existing&&existing.refId===p.id?'selected':''}>${escapeHtml(p.nom)}</option>`).join('')}</select></div>
        <div class="field"><label>Type</label>
          <select id="vtType">
            <option value="e-recharge" ${existing&&existing.type==='e-recharge'?'selected':''}>E‑Recharge</option>
            <option value="depot" ${existing&&existing.type==='depot'?'selected':''}>Dépôt (cash‑in)</option>
            <option value="retrait" ${existing&&existing.type==='retrait'?'selected':''}>Retrait (cash‑out)</option>
          </select>
        </div>
        <div class="field"><label>Montant (GNF)</label><input type="number" id="vtMontant" min="1" value="${existing?existing.montant:''}" required></div>
      </div>
      <div class="login-error" id="vtError"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn btn-gold">${existing?'Enregistrer':'Enregistrer'}</button>
      </div>
    </form>`);
  document.getElementById('vtForm').addEventListener('submit', e=>{
    e.preventDefault();
    const pdvId = document.getElementById('vtPdv').value;
    const type = document.getElementById('vtType').value;
    const montant = parsePositiveAmount(document.getElementById('vtMontant').value);
    const err = document.getElementById('vtError');
    if(montant===null){ err.textContent = 'Le montant doit être un nombre positif.'; return; }
    if(existing){
      // Simule le solde après annulation de l'ancien mouvement, sans modifier DB, pour
      // valider le nouveau montant avant de toucher au stock (évite un rollback qui
      // pourrait lui-même échouer et laisser le stock dans un état incohérent).
      const stockKey = type==='e-recharge' ? 'stockRecharge' : 'stockFloat';
      const oldStockKey = existing.type==='e-recharge' ? 'stockRecharge' : 'stockFloat';
      const simulated = { ...DB[oldStockKey] };
      if(existing.type==='e-recharge') simulated[existing.refId] = (simulated[existing.refId]||0) + existing.montant;
      else if(existing.type==='retrait') simulated[existing.refId] = (simulated[existing.refId]||0) + existing.montant;
      else if(existing.type==='depot') simulated[existing.refId] = (simulated[existing.refId]||0) - existing.montant;
      const soldeDispo = stockKey===oldStockKey ? (simulated[pdvId]||0) : (DB[stockKey][pdvId]||0);
      if(type==='e-recharge' && soldeDispo < montant){ err.textContent = `Stock e-recharge insuffisant pour ${pdvName(pdvId)}.`; return; }
      if(type==='retrait' && soldeDispo < montant){ err.textContent = `Stock float insuffisant pour ${pdvName(pdvId)} pour ce retrait.`; return; }
      // Validé : on peut maintenant reverser puis appliquer sans risque d'échec.
      reverseVenteEffect(existing);
      applyVenteEffect(pdvId, type, montant);
      existing.refId = pdvId; existing.type = type; existing.montant = montant;
      logActivity(`Vente modifiée — ${pdvName(pdvId)} (${fmtGNF(montant)})`);
      saveDB(); closeModal(); renderVentesView(); toast('Mouvement mis à jour','success');
    } else {
      const problem = applyVenteEffect(pdvId, type, montant);
      if(problem){ err.textContent = problem; return; }
      DB.ventes.unshift({ id: uid('VT'), niveau:'pdv', refId: pdvId, type, montant, date: nowISO() });
      logActivity(`${type==='e-recharge'?'Vente e-recharge':(type==='depot'?'Dépôt':'Retrait')} enregistré — ${pdvName(pdvId)} (${fmtGNF(montant)})`);
      saveDB(); closeModal(); renderVentesView(); toast('Mouvement enregistré','success');
    }
  });
}

function deleteVente(id){
  const v = DB.ventes.find(x=>x.id===id);
  if(!v) return;
  if(!confirm(`Supprimer ce mouvement (${pdvName(v.refId)} — ${fmtGNF(v.montant)}) ? Le stock impacté sera restauré.`)) return;
  reverseVenteEffect(v);
  DB.ventes = DB.ventes.filter(x=>x.id!==id);
  logActivity(`Mouvement supprimé — ${pdvName(v.refId)} (${fmtGNF(v.montant)})`);
  saveDB(); renderVentesView(); toast('Mouvement supprimé, stock restauré','success');
}

PDV-002,depot,1200000"></textarea></div>

    <div class="modal-foot">

function processCsvImport(){
  const raw = document.getElementById('csvContent').value.trim();
  const err = document.getElementById('csvError');
  if(!raw){ err.textContent = 'Veuillez coller du contenu CSV.'; return; }
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let imported = 0, errors = [];
  lines.forEach((line,i)=>{
    const parts = line.split(',').map(p=>p.trim());
    if(parts.length!==3){ errors.push(`Ligne ${i+1} : format invalide`); return; }
    const [pdvId, type, montantStr] = parts;
    const montant = parsePositiveAmount(montantStr);
    if(!DB.pdvs.find(p=>p.id===pdvId)){ errors.push(`Ligne ${i+1} : PDV inconnu (${pdvId})`); return; }
    if(!['e-recharge','depot','retrait'].includes(type)){ errors.push(`Ligne ${i+1} : type invalide (${type})`); return; }
    if(montant===null){ errors.push(`Ligne ${i+1} : montant invalide`); return; }
    // Réutilise la même logique de mutation de stock que le formulaire de vente unitaire
    // (openVenteModal), pour que les deux points d'entrée restent toujours cohérents.
    const problem = applyVenteEffect(pdvId, type, montant);
    if(problem){ errors.push(`Ligne ${i+1} : ${problem}`); return; }
    DB.ventes.unshift({ id: uid('VT'), niveau:'pdv', refId: pdvId, type, montant, date: nowISO() });
    imported++;
  });
  if(imported>0){ logActivity(`Import CSV : ${imported} mouvement(s) enregistré(s)`); saveDB(); }
  if(errors.length){ err.innerHTML = `${imported} ligne(s) importée(s).<br>Erreurs : ${errors.slice(0,5).join(' · ')}`; }
  else { closeModal(); toast(`${imported} mouvement(s) importé(s)`,'success'); }
  renderVentesView();
}

/* =========================================================
   VUE : GROSSISTE E-RECHARGE (registre revendeurs)
   1 paquet = 100 000 GNF. Registre chronologique à solde couru.
   ========================================================= */
function stockELivreSolde(){
  const list = DB.stockERechargeLivre;
  if(!list.length) return { montant:0, paquets:0 };
  const last = list[list.length-1];
  return { montant:last.soldeMontant, paquets:last.soldePaquets };
}
function stockELivreRecalculer(){
  let solde = 0, soldePaquets = 0;
  DB.stockERechargeLivre.forEach(m=>{
    if(m.type==='stock_initial'){ solde = m.montant; soldePaquets = m.paquets; }
    else if(m.type==='entree'){ solde += m.montant; soldePaquets += m.paquets; }
    else if(m.type==='sortie'){ solde -= m.montant; soldePaquets -= m.paquets; if(m.retourMontant){ solde += m.retourMontant; soldePaquets += m.retourPaquets; } }
    m.soldeMontant = solde; m.soldePaquets = soldePaquets;
  });
}

let stockELivreFilters = { recherche:'', type:'', dateDebut:'', dateFin:'' };
function applyStockELivreFilters(list){
  const f = stockELivreFilters;
  const q = (f.recherche||'').trim().toLowerCase();
  return list.filter(m=>{
    if(f.type && m.type!==f.type) return false;
    if(f.dateDebut && String(m.date).slice(0,10) < f.dateDebut) return false;
    if(f.dateFin && String(m.date).slice(0,10) > f.dateFin) return false;
    if(q){
      const hay = [m.revendeur,m.nom,m.libelle,m.id,m.type,m.date].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function renderStockELivreView(){
  document.getElementById('topbarActions').innerHTML = `
    <button class="btn btn-gold" onclick="openStockELivreEntreeModal()">+ Achat E‑Recharge (Orange GN)</button>`;
  const host = document.getElementById('viewsHost');
  const allList = [...DB.stockERechargeLivre]; // ordre chronologique, solde couru
  const list = applyStockELivreFilters(allList);

let chart3 = null;

function openStockELivreEntreeModal(){
  openModal(`
    <div class="modal-head"><h3>Achat E‑Recharge auprès d'Orange GN</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <p style="font-size:12.5px;color:var(--text-mid);margin-top:-8px">Cet achat alimentera automatiquement le <b style="color:var(--text-hi)">Stock Central</b>, prêt à être distribué vers les agences puis les PDV.</p>
    <form id="selEntreeForm">
      <div class="form-grid">
        <div class="field"><label>Montant (GNF)</label><input type="number" id="selEntreeMontant" min="100000" step="100000" required></div>
        <div class="field"><label>Paquets (auto)</label><input type="number" id="selEntreePaquets" readonly style="opacity:.6"></div>
        <div class="field full"><label>Libellé</label>
          <select id="selEntreeLibelleSelect">
            <option value="Achat Orange GN" selected>Achat Orange GN</option>
            <option value="Ajustement d'inventaire">Ajustement d'inventaire</option>
            <option value="Correction d'écart">Correction d'écart</option>
            <option value="__autre">Autre (préciser)…</option>
          </select>
        </div>
        <div class="field full" id="selEntreeLibelleAutreWrap" style="display:none"><label>Précisez le libellé</label><input type="text" id="selEntreeLibelleAutre" placeholder="Saisir un libellé personnalisé"></div>
        <div class="field full"><label>Date</label><input type="date" id="selEntreeDate" value="${todayISO()}" required></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn btn-gold">Enregistrer l'achat</button>
      </div>
    </form>`);
  const mEl = document.getElementById('selEntreeMontant'), pEl = document.getElementById('selEntreePaquets');
  mEl.addEventListener('input', ()=>{ pEl.value = Math.round((Number(mEl.value)||0)/100000); });
  const libSelEl = document.getElementById('selEntreeLibelleSelect'), libAutreWrap = document.getElementById('selEntreeLibelleAutreWrap'), libAutreEl = document.getElementById('selEntreeLibelleAutre');
  libSelEl.addEventListener('change', ()=>{
    const isAutre = libSelEl.value === '__autre';
    libAutreWrap.style.display = isAutre ? '' : 'none';
    libAutreEl.required = isAutre;
  });
  document.getElementById('selEntreeForm').addEventListener('submit', e=>{
    e.preventDefault();
    const montant = parsePositiveAmount(mEl.value);
    if(montant===null){ toast('Le montant doit être un nombre positif.','error'); return; }
    const paquets = Math.round(montant/100000);
    const libelle = libSelEl.value === '__autre' ? libAutreEl.value.trim() : libSelEl.value;
    if(!libelle){ toast('Veuillez préciser le libellé.','error'); return; }
    DB.stockERechargeLivre.push({ id: uid('SEL'), date: document.getElementById('selEntreeDate').value, type:'entree',
      libelle, montant, paquets });
    stockELivreRecalculer();
    // Chaque achat auprès d'Orange GN alimente directement le Stock Central,
    // qui pourra ensuite être distribué vers les agences puis les PDV via Transferts.
    DB.stockRecharge.central = (DB.stockRecharge.central || 0) + paquets;
    logActivity(`Achat E-Recharge Orange GN : ${fmtGNF(montant)} (${paquets} paquets) → Stock Central`);
    saveDB(); closeModal(); renderStockELivreView(); toast('Achat enregistré, Stock Central mis à jour','success');
  });
}

function openCreditClientModal(id){
  const existing = id ? DB.creditsClients.find(c=>c.id===id) : null;
  openModal(`
    <div class="modal-head"><h3>${existing?'Modifier le crédit client':'Nouveau crédit client'}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <form id="ccForm">
      <div class="form-grid">
        <div class="field"><label>N° client</label><input type="text" id="ccClient" placeholder="ex. 621950000" value="${existing?escapeHtml(existing.client):''}" required></div>
        <div class="field"><label>Nom (optionnel)</label><input type="text" id="ccNom" placeholder="ex. Camara Amadou" value="${existing&&existing.nom!=='—'?escapeHtml(existing.nom):''}"></div>
        <div class="field"><label>Montant du crédit (GNF)</label><input type="number" id="ccMontant" min="${existing?existing.montantPaye:1}" value="${existing?existing.montant:''}" required></div>
        <div class="field"><label>Date</label><input type="date" id="ccDate" value="${existing?existing.date:todayISO()}" required></div>
      </div>
      <div class="login-error" id="ccError"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn btn-gold">${existing?'Enregistrer':'Enregistrer'}</button>
      </div>
    </form>`);
  document.getElementById('ccForm').addEventListener('submit', e=>{
    e.preventDefault();
    const montant = parsePositiveAmount(document.getElementById('ccMontant').value);
    const errEl = document.getElementById('ccError');
    if(montant===null){ errEl.textContent = 'Le montant doit être un nombre positif.'; return; }
    if(existing){
      if(montant < existing.montantPaye){ errEl.textContent = `Le montant ne peut pas être inférieur au montant déjà payé (${fmtGNF(existing.montantPaye)}).`; return; }
      existing.client = document.getElementById('ccClient').value.trim();
      existing.nom = document.getElementById('ccNom').value.trim() || '—';
      existing.montant = montant; existing.date = document.getElementById('ccDate').value;
      existing.statut = existing.montantPaye >= existing.montant ? 'Soldé' : 'En cours';
      logActivity(`Crédit client modifié : ${fmtGNF(montant)} (${existing.client})`);
      saveDB(); closeModal(); renderCreditsClientsView(); toast('Crédit client mis à jour','success');
    } else {
      DB.creditsClients.unshift({ id: uid('CC'), client: document.getElementById('ccClient').value.trim(),
        nom: document.getElementById('ccNom').value.trim() || '—', montant, montantPaye: 0,
        date: document.getElementById('ccDate').value, statut:'En cours' });
      logActivity(`Crédit client accordé : ${fmtGNF(montant)}`);
      saveDB(); closeModal(); renderCreditsClientsView(); toast('Crédit client enregistré','success');
    }
  });
}

function deleteCreditClient(id){
  const c = DB.creditsClients.find(x=>x.id===id);
  if(!c) return;
  if(!confirm(`Supprimer le crédit client de ${c.client} (${fmtGNF(c.montant)}) ? Cette action est irréversible.`)) return;
  DB.creditsClients = DB.creditsClients.filter(x=>x.id!==id);
  logActivity(`Crédit client supprimé : ${c.client} (${fmtGNF(c.montant)})`);
  saveDB(); renderCreditsClientsView(); toast('Crédit client supprimé','success');
}

function openCreditClientPaiementModal(id){
  const c = DB.creditsClients.find(x=>x.id===id);
  if(!c) return;
  const reste = c.montant - c.montantPaye;
  openModal(`
    <div class="modal-head"><h3>Encaisser un paiement</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <p style="font-size:12.5px;color:var(--text-mid);margin-top:-8px">Client ${escapeHtml(c.client)} — reste dû : <b style="color:var(--text-hi)">${fmtGNF(reste)}</b></p>
    <form id="ccPayForm">
      <div class="form-grid">
        <div class="field full"><label>Montant encaissé (GNF)</label><input type="number" id="ccPayMontant" min="1" max="${reste}" value="${reste}" required></div>
      </div>
      <div class="login-error" id="ccPayError"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn btn-gold">Encaisser</button>
      </div>
    </form>`);
  document.getElementById('ccPayForm').addEventListener('submit', e=>{
    e.preventDefault();
    const montant = parsePositiveAmount(document.getElementById('ccPayMontant').value);
    const errEl = document.getElementById('ccPayError');
    if(montant===null){ errEl.textContent = 'Le montant doit être un nombre positif.'; return; }
    if(montant > reste){ errEl.textContent = 'Le montant dépasse le reste dû.'; return; }
    c.montantPaye += montant;
    if(c.montantPaye >= c.montant) c.statut = 'Soldé';
    logActivity(`Paiement crédit client reçu : ${fmtGNF(montant)} (${c.client})`);
    saveDB(); closeModal(); renderCreditsClientsView(); toast('Paiement enregistré','success');
  });
}

  if(!a) return;
  if(!confirm(`Supprimer l'avance de ${a.deposant} (${fmtGNF(a.montant)}) ? Cette action est irréversible.`)) return;
  DB.avances = DB.avances.filter(x=>x.id!==id);
  logActivity(`Avance supprimée : ${a.deposant} (${fmtGNF(a.montant)})`);
  saveDB(); renderAvancesView(); toast('Avance supprimée','success');
}

function openAvanceRemboursementModal(id){
  const a = DB.avances.find(x=>x.id===id);
  if(!a) return;
  const reste = a.montant - a.montantRembourse;
  openModal(`
    <div class="modal-head"><h3>Rembourser l'avance</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <p style="font-size:12.5px;color:var(--text-mid);margin-top:-8px">${escapeHtml(a.deposant)} — reste à rembourser : <b style="color:var(--text-hi)">${fmtGNF(reste)}</b></p>
    <form id="avPayForm">
      <div class="form-grid">
        <div class="field full"><label>Montant remboursé (GNF)</label><input type="number" id="avPayMontant" min="1" max="${reste}" value="${reste}" required></div>
      </div>
      <div class="login-error" id="avPayError"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn btn-gold">Rembourser</button>
      </div>
    </form>`);
  document.getElementById('avPayForm').addEventListener('submit', e=>{
    e.preventDefault();
    const montant = parsePositiveAmount(document.getElementById('avPayMontant').value);
    const errEl = document.getElementById('avPayError');
    if(montant===null){ errEl.textContent = 'Le montant doit être un nombre positif.'; return; }
    if(montant > reste){ errEl.textContent = 'Le montant dépasse le reste à rembourser.'; return; }
    a.montantRembourse += montant;
    a.statut = a.montantRembourse >= a.montant ? 'Soldée' : 'Partielle';
    logActivity(`Remboursement avance : ${fmtGNF(montant)} (${a.deposant})`);
    saveDB(); closeModal(); renderAvancesView(); toast('Remboursement enregistré','success');
  });
}

  const encours = list.reduce((s,r)=>s+(r.montant - r.montantRembourse),0);
  const totalRetourne = list.reduce((s,r)=>s+r.montant,0);

    <div class="kpi-grid">
      <div class="kpi-card" style="--accent:var(--gold)"><div class="lbl"><span class="ic">${icon('returns')}</span>Encours non remboursé</div><div class="val">${fmtGNF(encours)}</div></div>

      <div class="kpi-card" style="--accent:var(--red)"><div class="lbl"><span class="ic">${icon('warning')}</span>Total retours</div><div class="val">${fmtNum(list.length)}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <h3>Retours</h3>
        <div class="chip-select">
          ${dateRangeFilterHtml(retoursFilters.dateDebut, retoursFilters.dateFin,
            "retoursFilters.dateDebut=this.value; renderRetoursView()",
            "retoursFilters.dateFin=this.value; renderRetoursView()",
            "retoursFilters.dateDebut=''; retoursFilters.dateFin=''; renderRetoursView()")}
        </div>
        <div class="sub">${list.length} enregistrement(s)</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Client</th><th>Montant retourné</th><th>Remboursé</th><th>Reste</th><th>Statut</th><th></th></tr></thead>
          <tbody>${list.map(r=>{
            const reste = r.montant - r.montantRembourse;
            return `<tr>
              <td>${fmtDate(r.date)}</td>
              <td class="strong">${escapeHtml(r.client)}</td>
              <td>${fmtGNF(r.montant)}</td>
              <td style="color:var(--green)">${fmtGNF(r.montantRembourse)}</td>
              <td style="color:${reste>0?'var(--red)':'var(--text-dim)'}">${fmtGNF(reste)}</td>
              <td><span class="pill ${r.statut==='Soldé'?'pill-ok':'pill-warn'}">${escapeHtml(r.statut)}</span></td>
              <td style="white-space:nowrap">
                ${reste>0?`<button class="btn btn-teal btn-sm" onclick="openRetourRemboursementModal('${r.id}')">Rembourser</button>`:''}
                <button class="btn btn-outline btn-sm" onclick="openRetourModal('${r.id}')">Modifier</button>
                <button class="btn btn-danger btn-sm" onclick="deleteRetour('${r.id}')">Suppr.</button>
              </td>
            </tr>`;
          }).join('')}</tbody>

function openRetourModal(id){
  const existing = id ? DB.retours.find(r=>r.id===id) : null;
  openModal(`
    <div class="modal-head"><h3>${existing?'Modifier le retour':'Nouveau retour'}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <form id="rtForm">
      <div class="form-grid">
        <div class="field"><label>N° client</label><input type="text" id="rtClient" placeholder="ex. 628792466" value="${existing?escapeHtml(existing.client):''}" required></div>
        <div class="field"><label>Montant retourné (GNF)</label><input type="number" id="rtMontant" min="${existing?existing.montantRembourse:1}" value="${existing?existing.montant:''}" required></div>
        <div class="field full"><label>Date</label><input type="date" id="rtDate" value="${existing?existing.date:todayISO()}" required></div>
      </div>
      <div class="login-error" id="rtError"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn btn-gold">Enregistrer</button>
      </div>
    </form>`);
  document.getElementById('rtForm').addEventListener('submit', e=>{
    e.preventDefault();
    const montant = parsePositiveAmount(document.getElementById('rtMontant').value);
    const errEl = document.getElementById('rtError');
    if(montant===null){ errEl.textContent = 'Le montant doit être un nombre positif.'; return; }
    if(existing){
      if(montant < existing.montantRembourse){ errEl.textContent = `Le montant ne peut pas être inférieur au montant déjà remboursé (${fmtGNF(existing.montantRembourse)}).`; return; }
      existing.client = document.getElementById('rtClient').value.trim();
      existing.montant = montant; existing.date = document.getElementById('rtDate').value;
      existing.statut = existing.montantRembourse >= existing.montant ? 'Soldé' : 'En cours';
      logActivity(`Retour modifié : ${fmtGNF(montant)} (${existing.client})`);
      saveDB(); closeModal(); renderRetoursView(); toast('Retour mis à jour','success');
    } else {
      DB.retours.unshift({ id: uid('RT'), client: document.getElementById('rtClient').value.trim(),
        montant, montantRembourse: 0, date: document.getElementById('rtDate').value, statut:'En cours' });
      logActivity(`Retour enregistré : ${fmtGNF(montant)}`);
      saveDB(); closeModal(); renderRetoursView(); toast('Retour enregistré','success');
    }
  });
}

function deleteRetour(id){
  const r = DB.retours.find(x=>x.id===id);

  if(!confirm(`Supprimer le retour de ${r.client} (${fmtGNF(r.montant)}) ? Cette action est irréversible.`)) return;
  DB.retours = DB.retours.filter(x=>x.id!==id);
  logActivity(`Retour supprimé : ${r.client} (${fmtGNF(r.montant)})`);
  saveDB(); renderRetoursView(); toast('Retour supprimé','success');
}

   VUE : CRÉDIT FOURNISSEUR OFMG

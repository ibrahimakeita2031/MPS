function renderCreditView(){
  document.getElementById('topbarActions').innerHTML = `
    <button class="btn btn-outline" onclick="openEcheanceModal()">+ Nouvelle échéance</button>
    <button class="btn btn-gold" onclick="openPaiementModal()">+ Enregistrer un paiement</button>`;
  const host = document.getElementById('viewsHost');
  const c = DB.creditOFMG;
  const today = new Date(todayISO());
  // Statut calculé dynamiquement : une échéance non soldée dont la date est dépassée est "En retard"
  const echeancesTriees = [...c.echeances].sort((a,b)=>new Date(a.dateEcheance)-new Date(b.dateEcheance)).map(e=>{
    const statutCalcule = e.statut==='Soldée' ? 'Soldée' : (new Date(e.dateEcheance)<today ? 'En retard' : 'À venir');
    return {...e, statutCalcule};
  });
  const retard = echeancesTriees.filter(e=>e.statutCalcule==='En retard');

  host.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card" style="--accent:var(--orange)"><div class="lbl"><span class="ic">${icon('float')}</span> Solde crédit OFMG</div><div class="val">${fmtGNF(c.solde)}</div></div>
      <div class="kpi-card" style="--accent:var(--red)"><div class="lbl"><span class="ic">${icon('warning')}</span> Échéances en retard</div><div class="val">${retard.length}</div></div>
      <div class="kpi-card" style="--accent:var(--green)"><div class="lbl"><span class="ic">${icon('orders')}</span> Total payé (historique)</div><div class="val">${fmtGNF(Math.abs(c.mouvements.filter(m=>m.type==='paiement').reduce((s,m)=>s+m.montant,0)))}</div></div>
      <div class="kpi-card" style="--accent:var(--gold)"><div class="lbl"><span class="ic">${icon('wholesaler')}</span> Total commandé (historique)</div><div class="val">${fmtGNF(c.mouvements.filter(m=>m.type==='augmentation').reduce((s,m)=>s+m.montant,0))}</div></div>
    </div>

    ${retard.length ? `<div class="panel">${retard.map(e=>`
      <div class="alert-box alert-danger" style="align-items:center">
        <span>${icon('warning',16)}</span>
        <div style="flex:1"><b>Échéance en retard</b> — ${fmtGNF(e.montant)} — ${escapeHtml(e.note)} (échéance : ${fmtDate(e.dateEcheance)})</div>
        <button class="btn btn-sm btn-gold" onclick="openPaiementModal('${e.id}')">Régler</button>
      </div>`).join('')}</div>` : ''}

    <div class="panel">
      <div class="panel-head"><h3>Évolution du solde crédit OFMG</h3><div class="sub">Chronologique, du plus ancien au plus récent</div></div>
      <canvas id="chartCreditOFMG" height="90"></canvas>
    </div>

    <div class="two-col">
      <div class="panel">
        <div class="panel-head"><h3>Historique des mouvements</h3></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Type</th><th>Montant</th><th>Référence</th><th>Date</th><th>Note</th></tr></thead>
            <tbody>${c.mouvements.map(m=>`
              <tr>
                <td><span class="pill ${m.type==='augmentation'?'pill-warn':'pill-ok'}">${m.type==='augmentation'?'Augmentation':'Paiement'}</span></td>
                <td class="${m.montant<0?'':''}" style="color:${m.montant<0?'var(--green)':'var(--gold-light)'}">${m.montant<0?'':'+'}${fmtGNF(m.montant)}</td>
                <td>${escapeHtml(m.reference)}</td>
                <td>${fmtDate(m.date)}</td>
                <td style="color:var(--text-dim)">${escapeHtml(m.note)}</td>
              </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Échéancier</h3></div>
        ${echeancesTriees.map(e=>`
          <div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)">
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;gap:8px">
              <span class="strong" style="color:var(--text-hi)">${fmtGNF(e.montant)}</span>
              <span class="pill ${e.statutCalcule==='En retard'?'pill-danger':(e.statutCalcule==='Soldée'?'pill-ok':'pill-warn')}">${e.statutCalcule}</span>
            </div>
            <div style="font-size:11.5px;color:var(--text-dim);margin-top:3px">${escapeHtml(e.note)} · Échéance ${fmtDate(e.dateEcheance)}</div>
            ${e.statutCalcule!=='Soldée' ? `<button class="btn btn-sm btn-outline" style="margin-top:6px" onclick="openPaiementModal('${e.id}')">Marquer payée / régler</button>` : ''}
          </div>`).join('') || `<div class="empty-state"><div class="ic">${icon('orders',28)}</div><div class="msg">Aucune échéance en cours.</div></div>`}
      </div>
    </div>`;
  drawCreditOFMGChart(c);
}

let chart4 = null;
function drawCreditOFMGChart(c){
  const ctx = document.getElementById('chartCreditOFMG');
  if(!ctx) return;
  // Reconstitue le solde couru chronologique à partir du solde actuel en remontant les mouvements
  const chrono = [...c.mouvements].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const soldesChrono = [];
  let s = c.solde;
  for(let i=chrono.length-1;i>=0;i--){ soldesChrono.unshift(s); s -= chrono[i].montant; }
  const labels = chrono.map(m=>fmtDate(m.date));
  if(chart4) chart4.destroy();
  chart4 = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets:[{ label:'Solde crédit (GNF)', data: soldesChrono, borderColor:'#ff7900', backgroundColor:'rgba(255,121,0,.12)', fill:true, tension:.25, pointRadius:2 }]},
    options:{ plugins:{legend:{display:false}}, scales:{
      x:{ ticks:{color:'#a8b3c7', font:{size:10}, maxRotation:0, autoSkip:true, maxTicksLimit:8}, grid:{display:false} },
      y:{ ticks:{color:'#a8b3c7', font:{size:10}, callback:v=>(v/1000000).toFixed(0)+'M'}, grid:{color:'rgba(255,255,255,.05)'} }
    }}
  });
}

function openEcheanceModal(){
  openModal(`
    <div class="modal-head"><h3>Nouvelle échéance OFMG</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <form id="echForm">
      <div class="form-grid">
        <div class="field"><label>Montant (GNF)</label><input type="number" id="echMontant" min="1" required></div>
        <div class="field"><label>Date d'échéance</label><input type="date" id="echDate" required></div>
        <div class="field full"><label>Note</label><input type="text" id="echNote" placeholder="ex. Échéance mensuelle"></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn btn-gold">Créer l'échéance</button>
      </div>
    </form>`);
  document.getElementById('echForm').addEventListener('submit', e=>{
    e.preventDefault();
    const montant = parsePositiveAmount(document.getElementById('echMontant').value);
    if(montant===null){ toast('Le montant doit être un nombre positif.','error'); return; }
    DB.creditOFMG.echeances.push({
      id: uid('ECH'), montant,
      dateEcheance: document.getElementById('echDate').value, statut:'À venir',
      note: document.getElementById('echNote').value.trim() || 'Échéance OFMG'
    });

  });
}

function openPaiementModal(echeanceId){
  const ech = echeanceId ? DB.creditOFMG.echeances.find(e=>e.id===echeanceId) : null;
  openModal(`
    <div class="modal-head"><h3>${ech?"Régler l'échéance":'Enregistrer un paiement OFMG'}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <form id="payForm">
      <div class="form-grid">
        <div class="field"><label>Montant (GNF)</label><input type="number" id="payMontant" min="1" value="${ech?ech.montant:''}" required></div>
        <div class="field"><label>Date</label><input type="date" id="payDate" value="${todayISO()}" required></div>
        <div class="field full"><label>Référence bancaire</label><input type="text" id="payRef" placeholder="ex. VIR-778900" required></div>
        <div class="field full"><label>Note</label><input type="text" id="payNote" placeholder="ex. Paiement échéance mensuelle" value="${ech?'Règlement : '+escapeHtml(ech.note):''}"></div>
      </div>
      <div class="login-error" id="payError"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn btn-gold">Enregistrer le paiement</button>
      </div>
    </form>`);
  document.getElementById('payForm').addEventListener('submit', e=>{
    e.preventDefault();
    const montant = parsePositiveAmount(document.getElementById('payMontant').value);
    const errEl = document.getElementById('payError');
    if(montant===null){ errEl.textContent = 'Le montant doit être un nombre positif.'; return; }
    if(montant > DB.creditOFMG.solde){
      errEl.textContent = `Le montant dépasse le solde actuel (${fmtGNF(DB.creditOFMG.solde)}).`;
      return;
    }
    DB.creditOFMG.solde -= montant;
    DB.creditOFMG.mouvements.unshift({ id: uid('CR'), type:'paiement', montant: -montant, date: document.getElementById('payDate').value,
      reference: document.getElementById('payRef').value.trim(), note: document.getElementById('payNote').value.trim() || 'Paiement OFMG' });
    // Une échéance n'est soldée que si le paiement couvre au moins son montant ;
    // un paiement partiel réduit le solde global mais laisse l'échéance ouverte,
    // pour ne pas perdre la traçabilité du reste dû sur cette échéance précise.
    let soldeMsg = '';
    if(ech){
      if(montant >= ech.montant){ ech.statut = 'Soldée'; soldeMsg = ' (échéance soldée)'; }
      else { soldeMsg = ' (paiement partiel — échéance toujours ouverte)'; }
    }
    logActivity(`Paiement OFMG enregistré : ${fmtGNF(montant)}${soldeMsg}`);
    saveDB(); closeModal(); renderCreditView(); toast('Paiement enregistré, solde mis à jour','success');
  });
}

      ${data.tables.map(t=>`

          <div class="table-wrap"><table><thead><tr>${t.cols.map(c=>`<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>

          ${t.rows.length>100?`<div style="font-size:11px;color:var(--text-dim);margin-top:7px">Affichage des 100 premières lignes · Export complet disponible en PDF/Excel.</div>`:''}

function scopedVentes(){ return DB.ventes.filter(v=>isInScopePdv(v.refId)); }
function scopedTransferts(){ return DB.transferts.filter(t=>true); }
function scopedConversions(){ return DB.conversions.filter(c=>isInScopePdv(c.pdvId)); }
function scopedCommandes(){ return DB.commandes; }

// Construit les données consolidées d'un rapport pour l'export (PDF et Excel partagent la même logique)
function buildRapportData(type, date){
  const d30 = new Date(); d30.setDate(d30.getDate()-30);
  const ventes30 = scopedVentes().filter(v=>new Date(v.date)>=d30);
  const transferts30 = scopedTransferts().filter(t=>new Date(t.date)>=d30);
  const conversions30 = scopedConversions().filter(c=>new Date(c.date)>=d30);
  if(type==='ventes'){
    return {titre:'Rapport des ventes — 30 derniers jours',
      kpis:[['Volume total',fmtGNF(ventes30.reduce((s,v)=>s+v.montant,0))],['Nombre de ventes',ventes30.length],['Ticket moyen',fmtGNF(ventes30.length?ventes30.reduce((s,v)=>s+v.montant,0)/ventes30.length:0)]],
      tables:[{titre:'Détail des ventes',cols:['PDV','Type','Montant (GNF)','Date'],rows:ventes30.map(v=>[pdvName(v.refId),v.type,v.montant,fmtDate(v.date)])}]};
  }
  if(type==='transferts'){
    return {titre:'Rapport des transferts — 30 derniers jours',
      kpis:[['Montant float',fmtGNF(transferts30.filter(t=>t.type==='float').reduce((s,t)=>s+t.montant,0))],['Nombre de transferts',transferts30.length],['Unités',fmtNum(transferts30.filter(t=>t.type!=='float').reduce((s,t)=>s+t.montant,0))]],
      tables:[{titre:'Détail des transferts',cols:['De','Vers','Type','Montant','Date'],rows:transferts30.map(t=>[nodeLabel(t.de),nodeLabel(t.vers),t.type,t.type==='float'?fmtGNF(t.montant):fmtNum(t.montant),fmtDate(t.date)])}]};
  }
  if(type==='commissions'){
    return {titre:'Rapport des commissions Dual Wallet — 30 jours',
      kpis:[['Commissions',fmtGNF(conversions30.reduce((s,c)=>s+c.commission,0))],['Conversions',conversions30.length],['Volume converti',fmtGNF(conversions30.reduce((s,c)=>s+c.montantFloat,0))]],
      tables:[{titre:'Détail des commissions',cols:['PDV','Float','Commission (GNF)','Date'],rows:conversions30.map(c=>[pdvName(c.pdvId),c.montantFloat,c.commission,fmtDate(c.date)])}]};
  }
  if(type==='credits'){
    const rows=(DB.creditsClients||[]).filter(c=>new Date(c.date)>=d30);
    return {titre:'Rapport des crédits clients — 30 jours',
      kpis:[['Montant accordé',fmtGNF(rows.reduce((s,c)=>s+c.montant,0))],['Dossiers',rows.length],['Encours',fmtGNF((typeof creditsClientsStats==='function'?creditsClientsStats().encours:0))]],
      tables:[{titre:'Crédits clients',cols:['Client','Montant (GNF)','Date','Statut'],rows:rows.map(c=>[c.client,c.montant,fmtDate(c.date),c.statut||'En cours'])}]};
  }
  if(type==='avances'){
    const rows=(DB.avances||[]).filter(a=>new Date(a.date)>=d30);
    return {titre:'Rapport des avances — 30 jours',
      kpis:[['Montant total',fmtGNF(rows.reduce((s,a)=>s+a.montant,0))],['Nombre',rows.length],['Moyenne',fmtGNF(rows.length?rows.reduce((s,a)=>s+a.montant,0)/rows.length:0)]],
      tables:[{titre:'Détail des avances',cols:['Déposant','Montant (GNF)','Date','Référence'],rows:rows.map(a=>[a.deposant,a.montant,fmtDate(a.date),a.reference||'—'])}]};
  }
  if(type==='retours'){
    const rows=(DB.retours||[]).filter(r=>new Date(r.date)>=d30);
    return {titre:'Rapport des retours — 30 jours',
      kpis:[['Montant retourné',fmtGNF(rows.reduce((s,r)=>s+r.montant,0))],['Retours',rows.length],['Remboursé',fmtGNF(rows.reduce((s,r)=>s+(r.montantRembourse||0),0))]],
      tables:[{titre:'Détail des retours',cols:['Client','Montant (GNF)','Remboursé','Date'],rows:rows.map(r=>[r.client,r.montant,r.montantRembourse||0,fmtDate(r.date)])}]};
  }
  if(type==='commandes'){
    const rows=(DB.commandes||[]).filter(c=>new Date(c.date||c.createdAt||0)>=d30);
    return {titre:'Rapport des commandes — 30 jours',
      kpis:[['Commandes',rows.length],['Montant',fmtGNF(rows.reduce((s,c)=>s+(c.montant||0),0))],['Clôturées',rows.filter(c=>c.statut==='Clôturée').length]],
      tables:[{titre:'Détail des commandes',cols:['Référence','Montant (GNF)','Statut','Date'],rows:rows.map(c=>[c.reference,c.montant||0,c.statut||'—',fmtDate(c.date||c.createdAt)])}]};
  }
  if(type==='pdv'){
    const by={}; ventes30.forEach(v=>{by[v.refId]=(by[v.refId]||0)+v.montant;});
    const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([id,val],i)=>[i+1,pdvName(id),val]);
    return {titre:'Rapport de performance des PDV — 30 jours',
      kpis:[['PDV actifs',rows.length],['Volume total',fmtGNF(ventes30.reduce((s,v)=>s+v.montant,0))],['Meilleur PDV',rows[0]?rows[0][1]:'—']],
      tables:[{titre:'Classement des PDV',cols:['#','PDV','Volume (GNF)'],rows}]};
  }
  if(type==='global'){
    return {titre:'Rapport d’activité globale — 30 jours',
      kpis:[['Ventes',fmtGNF(ventes30.reduce((s,v)=>s+v.montant,0))],['Transferts',transferts30.length],['Commissions',fmtGNF(conversions30.reduce((s,c)=>s+c.commission,0))]],
      tables:[
        {titre:'Ventes',cols:['PDV','Type','Montant (GNF)','Date'],rows:ventes30.map(v=>[pdvName(v.refId),v.type,v.montant,fmtDate(v.date)])},
        {titre:'Transferts',cols:['De','Vers','Type','Montant','Date'],rows:transferts30.map(t=>[nodeLabel(t.de),nodeLabel(t.vers),t.type,t.montant,fmtDate(t.date)])}
      ]};
  }
  if(type==='journalier'){
    const d = date || todayISO();
    const ventes = scopedVentes().filter(v=>v.date.slice(0,10)===d);
    const transferts = scopedTransferts().filter(t=>t.date.slice(0,10)===d);
    const conversions = scopedConversions().filter(c=>c.date.slice(0,10)===d);
    const creditMouvements = DB.creditOFMG.mouvements.filter(m=>m.date.slice(0,10)===d);
    return {
      titre: `Rapport journalier — ${fmtDate(d)}`,
      kpis: [
        ['Stock float total (clôture)', fmtGNF(totalStockFloat('all'))],
        ['Volume ventes du jour', fmtGNF(ventes.reduce((s,v)=>s+v.montant,0))],
        ['Commissions Dual Wallet', fmtGNF(conversions.reduce((s,c)=>s+c.commission,0))],
      ],
      tables: [
        { titre:'Ventes du jour', cols:['PDV','Type','Montant (GNF)'], rows: ventes.map(v=>[pdvName(v.refId), v.type, v.montant]) },
        { titre:'Transferts du jour', cols:['De','Vers','Type','Montant'], rows: transferts.map(t=>[nodeLabel(t.de), nodeLabel(t.vers), t.type, t.montant]) },
        { titre:'Mouvements de crédit OFMG', cols:['Type','Montant (GNF)','Référence'], rows: creditMouvements.map(m=>[m.type, Math.abs(m.montant), m.reference]) },
      ]
    };
  }
  if(type==='hebdomadaire'){
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-7);
    const ventes = scopedVentes().filter(v=>new Date(v.date)>=cutoff);
    const parPdv = {}; ventes.forEach(v=>{ parPdv[v.refId] = (parPdv[v.refId]||0)+v.montant; });
    const perfPdv = Object.entries(parPdv).sort((a,b)=>b[1]-a[1]).map(([id,val])=>[pdvName(id), val]);
    return {
      titre:'Rapport hebdomadaire (7 derniers jours)',
      kpis: [
        ['Volume 7 jours', fmtGNF(ventes.reduce((s,v)=>s+v.montant,0))],
        ['Nombre de ventes', ventes.length],
      ],
      tables: [
        { titre:'Performance par PDV', cols:['PDV','Volume (GNF)'], rows: perfPdv },
        { titre:'Détail des ventes', cols:['PDV','Type','Montant (GNF)','Date'], rows: ventes.map(v=>[pdvName(v.refId), v.type, v.montant, fmtDate(v.date)]) },
      ]
    };
  }
  // mensuel
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-30);
  const ventes = scopedVentes().filter(v=>new Date(v.date)>=cutoff);
  const conversions = scopedConversions().filter(c=>new Date(c.date)>=cutoff);
  const ranking = topPdvByVolume(30);
  return {
    titre:'Rapport mensuel (30 derniers jours)',
    kpis: [
      ['Volume total', fmtGNF(ventes.reduce((s,v)=>s+v.montant,0))],
      ['Commissions cumulées', fmtGNF(conversions.reduce((s,c)=>s+c.commission,0))],
      ['Crédit OFMG (solde actuel)', fmtGNF(DB.creditOFMG.solde)],
    ],
    tables: [
      { titre:'Ranking PDV (30 jours)', cols:['PDV','Volume (GNF)'], rows: ranking.map(r=>[r.nom, r.val]) },
      { titre:'Détail des ventes', cols:['PDV','Type','Montant (GNF)','Date'], rows: ventes.map(v=>[pdvName(v.refId), v.type, v.montant, fmtDate(v.date)]) },
    ]
  };
}

function exportRapportExcel(type, date){
  const data = buildRapportData(type, date);
  const wb = XLSX.utils.book_new();
  const wsResume = XLSX.utils.aoa_to_sheet([
    [data.titre], [],
    [`Généré le ${fmtDateTime(nowISO())} par ${currentUser().nom}`], [],
    ...data.kpis.map(([lbl,val])=>[lbl, val])
  ]);
  XLSX.utils.book_append_sheet(wb, wsResume, 'Résumé');
  data.tables.forEach(t=>{
    if(!t.rows.length) return;
    const ws = XLSX.utils.aoa_to_sheet([t.cols, ...t.rows]);
    XLSX.utils.book_append_sheet(wb, ws, t.titre.slice(0,31));
  });
  XLSX.writeFile(wb, `MPS_rapport_${type}_${date||todayISO()}.xlsx`);
  toast('Fichier Excel exporté','success');
}

function openUserModal(id){
  const existing = id ? DB.users.find(u=>u.id===id) : null;
  const ags = DB.agences;
  const showAgence = existing && (existing.role==='Responsable Agence'||existing.role==='Agent PDV');
  const showPdv = existing && existing.role==='Agent PDV';
  let pendingPhoto = existing ? (existing.photo || null) : null;
  const initialsFor = nom => (nom||'').trim().split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase() || '?';
  openModal(`
    <div class="modal-head"><h3>${existing?"Modifier l'utilisateur":'Nouvel utilisateur'}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <form id="userForm">
      <div class="avatar-picker" style="margin-bottom:16px">
        <div class="preview" id="avatarPreview">${pendingPhoto ? `<img src="${pendingPhoto}" alt="">` : initialsFor(existing?existing.nom:'')}</div>
        <div class="actions">
          <label class="btn btn-outline btn-sm" for="uPhotoInput" style="cursor:pointer;text-align:center">Choisir une photo</label>
          <input type="file" id="uPhotoInput" accept="image/*">

          <div style="font-size:11px;color:var(--text-dim)">JPG/PNG, 5 Mo max, recadrée automatiquement</div>

      </div>
      <div class="form-grid">
        <div class="field full"><label>Nom complet</label><input type="text" id="uNom" value="${existing?escapeHtml(existing.nom):''}" required></div>
        <div class="field"><label>Identifiant de connexion</label><input type="text" id="uLogin" value="${existing?escapeHtml(existing.login):''}" ${existing&&existing.id==='admin'?'readonly':''} required></div>
        <div class="field"><label>Mot de passe</label><input type="password" id="uPass" autocomplete="new-password" placeholder="${existing?'Laisser vide pour ne pas changer':''}" ${existing?'':'required'}></div>

          <select id="uAgence" onchange="refreshUserPdvOptions()">${ags.map(a=>`<option value="${a.id}" ${existing&&existing.agenceId===a.id?'selected':''}>${escapeHtml(a.nom)}</option>`).join('')}</select>

          <label>PDV de rattachement</label>
          <select id="uPdv"></select>
        </div>
      </div>
      <div class="login-error" id="userError"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn btn-gold">${existing?'Enregistrer':"Créer l'utilisateur"}</button>
      </div>
    </form>`);
  const refreshPreview = ()=>{
    const el = document.getElementById('avatarPreview');
    const nomVal = document.getElementById('uNom').value;
    el.innerHTML = pendingPhoto ? `<img src="${pendingPhoto}" alt="">` : initialsFor(nomVal);
  };
  refreshUserPdvOptions(existing?existing.pdvId:null);
  document.getElementById('uNom').addEventListener('input', ()=>{ if(!pendingPhoto) refreshPreview(); });
  document.getElementById('uPhotoInput').addEventListener('change', async e=>{
    const file = e.target.files[0];
    if(!file) return;
    document.getElementById('userError').textContent = '';
    try{
      pendingPhoto = await resizeImageToDataURL(file);
      refreshPreview();
    }catch(err){
      document.getElementById('userError').textContent = err.message || 'Impossible de charger cette image.';
      e.target.value = '';
    }
  });
  const removeBtn = document.getElementById('uPhotoRemove');
  if(removeBtn) removeBtn.addEventListener('click', ()=>{ pendingPhoto = null; document.getElementById('uPhotoInput').value=''; refreshPreview(); });
  document.getElementById('userForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const role = document.getElementById('uRole').value;
    const login = document.getElementById('uLogin').value.trim();
    const nom = document.getElementById('uNom').value.trim();
    const dup = DB.users.find(u=>u.login.toLowerCase()===login.toLowerCase() && (!existing || u.id!==existing.id));
    if(dup){ document.getElementById('userError').textContent = 'Cet identifiant existe déjà.'; return; }
    const passRaw = document.getElementById('uPass').value;
    // Un mot de passe est requis à la création, optionnel en modification (vide = inchangé),
    // mais s'il est fourni il doit avoir un minimum de robustesse (au moins 6 caractères,
    // pas uniquement des espaces).
    if((!existing || passRaw) && passRaw.trim().length < 6){
      document.getElementById('userError').textContent = 'Le mot de passe doit contenir au moins 6 caractères.';
      return;
    }
    const agenceId = (role==='Responsable Agence'||role==='Agent PDV') ? document.getElementById('uAgence').value : null;
    const pdvId = role==='Agent PDV' ? (document.getElementById('uPdv').value || null) : null;
    if(role==='Agent PDV' && !pdvId){ document.getElementById('userError').textContent = "Sélectionnez le PDV de rattachement (aucun PDV disponible dans cette agence)."; return; }
    if(existing){
      existing.nom = nom; existing.login = login; existing.photo = pendingPhoto;
      // Si l'admin définit un nouveau mot de passe pour ce compte, l'utilisateur
      // devra le changer à sa prochaine connexion (il ne doit pas rester sur
      // un mot de passe choisi par quelqu'un d'autre).
      if(passRaw){ existing.passHash = await hashPassword(passRaw); existing.mustChangePassword = true; }
      if(existing.id!=='admin'){ existing.role = role; existing.agenceId = agenceId; existing.pdvId = pdvId; }
      logActivity(`Utilisateur modifié : ${nom}`);
      saveDB(); closeModal(); renderUtilisateursView(); renderSidebar(); toast('Utilisateur mis à jour','success');
    } else {
      const passHash = await hashPassword(passRaw);
      DB.users.push({ id: uid('U'), nom, login, passHash, role, agenceId, pdvId, photo: pendingPhoto, mustChangePassword:true });
      logActivity(`Utilisateur créé : ${nom} (${role})`);
      saveDB(); closeModal(); renderUtilisateursView(); toast('Utilisateur créé','success');
    }
  });
}
function deleteUser(id){
  if(id==='admin'){ toast("Le compte administrateur principal ne peut pas être supprimé.",'error'); return; }
  if(SESSION && SESSION.userId===id){ toast('Vous ne pouvez pas supprimer votre propre compte pendant que vous êtes connecté.','error'); return; }
  const u = DB.users.find(x=>x.id===id);
  if(!u) return;
  if(!confirm(`Supprimer l'utilisateur « ${u.nom} » (${u.login}) ?`)) return;
  DB.users = DB.users.filter(x=>x.id!==id);
  logActivity(`Utilisateur supprimé : ${u.nom}`);
  saveDB(); renderUtilisateursView(); toast('Utilisateur supprimé','success');
}

function daysSinceBackup(){
  if(!DB.settings.lastBackupDate) return null;
  return Math.floor((new Date() - new Date(DB.settings.lastBackupDate)) / 86400000);
}
function backupStatusInfo(){
  const days = daysSinceBackup();
  if(days===null) return { color:'var(--red)', text:"Aucune sauvegarde n'a encore été exportée.", grave:true };
  if(days===0) return { color:'var(--green)', text:"Dernière sauvegarde : aujourd'hui.", grave:false };
  if(days===1) return { color:'var(--green)', text:"Dernière sauvegarde : hier.", grave:false };
  if(days<=7) return { color:'var(--green)', text:`Dernière sauvegarde il y a ${days} jours.`, grave:false };
  if(days<=14) return { color:'var(--gold)', text:`Dernière sauvegarde il y a ${days} jours — pensez à en refaire une.`, grave:false };
  return { color:'var(--red)', text:`Dernière sauvegarde il y a ${days} jours — fortement recommandé d'exporter maintenant.`, grave:true };
}

async function resetDemoData(){
  if(!confirm('Supprimer toutes les données de démonstration et repartir à zéro ? Les comptes utilisateurs seront conservés. Cette action est irréversible.')) return;
  if(prompt('Pour confirmer cette action irréversible, tapez RESET en majuscules :') !== 'RESET'){
    toast('Réinitialisation annulée.','error');
    return;
  }
  // On bloque temporairement l'application des snapshots distants pendant le
  // reset : sans ça, un onSnapshot Firestore concurrent pourrait renvoyer
  // l'ancien contenu et écraser silencieusement les données qu'on vient de
  // remettre à zéro, avant même que l'écriture n'ait été confirmée.
  fbApplyingRemote = true;
  try{
    DB = emptyDB();
    // emptyDB() renvoie des utilisateurs avec un mot de passe en clair (motdepasse) —
    // comme au premier lancement, il faut les hasher avant de sauvegarder,
    // sinon plus personne ne peut se reconnecter après la réinitialisation.
    for(const u of DB.users){ u.passHash = await hashPassword(u.motdepasse); delete u.motdepasse; }
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    if(window.__firebase){
      const { DB_DOC, setDoc } = window.__firebase;
      await setDoc(DB_DOC, { json: JSON.stringify(DB), updatedAt: Date.now() });
    }
  }catch(e){
    console.warn('Échec de la réinitialisation :', e);
    toast('Erreur pendant la réinitialisation — réessayez.','error');
    return;
  }finally{
    fbApplyingRemote = false;
  }
  toast('Données réinitialisées','success');
  renderSidebar();
  renderView();
}

async function resetAllToEmpty(){
  if(!confirm('Vider TOUTES les données de l\'application (agences, PDV, ventes, transferts, commandes, crédits, stocks...) ? Seuls les comptes utilisateurs seront conservés pour rester connecté. Cette action est irréversible.')) return;
  if(prompt('Pour confirmer cette action irréversible, tapez VIDER en majuscules :') !== 'VIDER'){
    toast('Opération annulée.','error');
    return;
  }
  // Même garde-fou que resetDemoData() : on bloque l'application des
  // snapshots distants pendant l'opération pour éviter qu'une synchronisation
  // concurrente ne réécrase silencieusement le vidage en cours.
  fbApplyingRemote = true;
  try{
    DB = emptyDB();
    // emptyDB() renvoie aussi des utilisateurs avec mot de passe en clair
    // (motdepasse) — même traitement que pour seedDB(), sinon personne ne
    // peut plus se reconnecter après le vidage.
    for(const u of DB.users){ u.passHash = await hashPassword(u.motdepasse); delete u.motdepasse; }
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    if(window.__firebase){
      const { DB_DOC, setDoc } = window.__firebase;
      await setDoc(DB_DOC, { json: JSON.stringify(DB), updatedAt: Date.now() });
    }
  }catch(e){
    console.warn('Échec du vidage complet :', e);
    toast('Erreur pendant le vidage — réessayez.','error');
    return;
  }finally{
    fbApplyingRemote = false;
  }
  toast('Toutes les données ont été vidées','success');
  renderSidebar();
  renderView();
}

/* =========================================================
   BOOTSTRAP
   ========================================================= */
async function boot(){
  await loadDB();
  loadSession();
  const sessionUser = SESSION ? DB.users.find(u=>u.id===SESSION.userId) : null;
  if(sessionUser){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').classList.add('active');
    if(sessionUser.mustChangePassword){
      // Bloque l'accès au reste de l'app tant que le mot de passe temporaire
      // n'a pas été changé. On ne montre pas la barre latérale ni les vues :
      // c'est un écran plein qui remplace tout, sans échappatoire.
      renderForceChangePassword(sessionUser);
      return;
    }
    currentView = 'dashboard';
    renderSidebar();
    renderView();
  } else {
    document.getElementById('app').classList.remove('active');
    document.getElementById('loginScreen').style.display='flex';
    renderLogin();
  }
}
boot();

function renderForceChangePassword(user){
  const host = document.getElementById('viewsHost');
  document.getElementById('sidebar').innerHTML = '';
  document.getElementById('topbarActions').innerHTML = '';
  document.getElementById('viewTitle').textContent = 'Changement de mot de passe requis';
  document.getElementById('viewBreadcrumb').textContent = 'Sécurité du compte';
  host.innerHTML = `
    <div class="panel" style="max-width:420px;margin:40px auto">
      <div class="panel-head"><h3>Bonjour ${escapeHtml(user.nom)}</h3><div class="sub">Pour des raisons de sécurité, vous devez définir un nouveau mot de passe avant de continuer. Le mot de passe temporaire fourni ne doit pas rester en usage.</div></div>
      <form id="forceChangeForm" style="display:flex;flex-direction:column;gap:14px;margin-top:14px">
        <div class="field"><label>Nouveau mot de passe</label><input type="password" id="fcNewPass" autocomplete="new-password" minlength="6" required></div>
        <div class="field"><label>Confirmer le nouveau mot de passe</label><input type="password" id="fcNewPass2" autocomplete="new-password" minlength="6" required></div>
        <div class="login-error" id="fcError"></div>
        <button type="submit" class="btn btn-gold">Définir le mot de passe et continuer</button>
      </form>
      <button class="logout-btn" style="margin-top:14px" onclick="doLogout()">Se déconnecter</button>
    </div>`;
  document.getElementById('forceChangeForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const p1 = document.getElementById('fcNewPass').value;
    const p2 = document.getElementById('fcNewPass2').value;
    const err = document.getElementById('fcError');
    if(p1.length < 6){ err.textContent = 'Le mot de passe doit contenir au moins 6 caractères.'; return; }
    if(p1 !== p2){ err.textContent = 'Les deux mots de passe ne correspondent pas.'; return; }
    user.passHash = await hashPassword(p1);
    user.mustChangePassword = false;
    logActivity(`Mot de passe changé (première connexion) : ${user.nom}`);
    saveDB();
    toast('Mot de passe mis à jour.', 'success');
    currentView = 'dashboard';
    renderSidebar();
    renderView();
  });
}

// Register service worker for offline/installable PWA support.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => {
      console.warn('Échec de l\'enregistrement du service worker :', err);
    });
  });
}

// ---- Bouton "Installer l'application" (PWA) --------------------------------
// Le listener beforeinstallprompt réel est attaché tout en haut du <head>
// (voir window.__deferredInstallPrompt) pour ne jamais rater l'événement.

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true; // iOS Safari
}

// iOS (Safari et navigateurs basés sur WebKit sur iOS) ne déclenche jamais
// beforeinstallprompt : il n'y a pas d'invite d'installation native possible.
// On détecte ce cas pour afficher des instructions manuelles à la place du bouton.
function isIosSafariInstallable(){
  const ua = navigator.userAgent;
  const isIos = /iPad|iPhone|iPod/.test(ua) || (ua.includes('Macintosh') && navigator.maxTouchPoints > 1);
  return isIos && !isStandalone();
}

function refreshInstallButton(){
  const canInstallNative = !!window.__deferredInstallPrompt && !isStandalone();
  const showIosHint = !canInstallNative && isIosSafariInstallable();
  // Plusieurs paires bouton/encart peuvent coexister dans le DOM selon l'écran
  // affiché (sidebar une fois connecté, écran de connexion avant login) —
  // on met à jour toutes celles présentes, sans dépendre d'un seul jeu d'IDs.
  [['installBtn','installIosHint'], ['loginInstallBtn','loginInstallIosHint']].forEach(([btnId, hintId])=>{
    const btn = document.getElementById(btnId);
    const iosHint = document.getElementById(hintId);
    if(btn) btn.classList.toggle('show', canInstallNative);
    if(iosHint) iosHint.classList.toggle('show', showIosHint);
  });
}

window.addEventListener('appinstalled', ()=>{
  window.__deferredInstallPrompt = null;
  refreshInstallButton();
  toast('Application installée avec succès','success');
});

async function installApp(){
  const promptEvent = window.__deferredInstallPrompt;
  if(!promptEvent) return;
  promptEvent.prompt();
  try{
    const { outcome } = await promptEvent.userChoice;
    if(outcome !== 'accepted'){ /* l'utilisateur a refusé, rien à faire */ }
  }catch(e){ /* invite annulée ou déjà consommée */ }
  window.__deferredInstallPrompt = null;
  refreshInstallButton();
}
</script>

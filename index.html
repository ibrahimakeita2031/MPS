function deleteVente(id){
  if(!requireRole('Administrateur','Direction','Comptable','Responsable Agence','Agent PDV')) return;
  const v = DB.ventes.find(x=>x.id===id);
  if(!v) return;
  if(!inMyScope(pdvAgenceId(v.refId), v.refId)){ toast('Ce mouvement est hors de votre périmètre.','error'); return; }
  // Un dépôt annulé retire du float : refuser si le solde deviendrait négatif.
  if(v.type==='depot' && (DB.stockFloat[v.refId]||0) < v.montant){
    toast(`Suppression impossible : le float de ${pdvName(v.refId)} deviendrait négatif (des retraits ont déjà consommé ce dépôt).`,'error');
    return;
  }
  if(!confirm(`Supprimer ce mouvement (${pdvName(v.refId)} — ${fmtGNF(v.montant)}) ? Le stock impacté sera restauré.`)) return;
  reverseVenteEffect(v);
  DB.ventes = DB.ventes.filter(x=>x.id!==id);
  logActivity(`Mouvement supprimé — ${pdvName(v.refId)} (${fmtGNF(v.montant)})`);
  saveDB(); renderStockSimpleView(); toast('Mouvement supprimé, stock restauré','success');
}

/* =========================================================
   VUE : GROSSISTE E-RECHARGE (registre revendeurs)
   1 paquet = 100 000 GNF. Registre chronologique à solde couru.
   ========================================================= */
function stockELivreRecalculer(){
  let solde = 0, soldePaquets = 0;
  DB.stockERechargeLivre.forEach(m=>{
    if(m.type==='stock_initial'){ solde = m.montant; soldePaquets = m.paquets; }
    else if(m.type==='entree'){ solde += m.montant; soldePaquets += m.paquets; }
    else if(m.type==='sortie'){ solde -= m.montant; soldePaquets -= m.paquets; if(m.retourMontant){ solde += m.retourMontant; soldePaquets += m.retourPaquets; } }
    m.soldeMontant = solde; m.soldePaquets = soldePaquets;
  });
}

/* =========================================================
   VUE : CRÉDITS CLIENTS
   ========================================================= */
// Numéros clients déjà connus (croisés sur crédits et avances) —
// utilisé pour proposer une liste de suggestion et éviter les fautes de
// frappe sur un client déjà existant, sans empêcher la saisie d'un nouveau.
function knownClients(){
  const set = new Map();
  (DB.creditsClients||[]).forEach(c=>{ if(c.client) set.set(c.client, c.nom&&c.nom!=='—'?c.nom:''); });
  (DB.avances||[]).forEach(a=>{ if(a.client && a.client!=='—') set.set(a.client, set.get(a.client)||''); });
  return [...set.entries()].map(([client,nom])=>({client,nom}));
}
function clientsDatalist(idAttr){
  const list = knownClients();
  return `<datalist id="${idAttr}">${list.map(c=>`<option value="${escapeHtml(c.client)}">${c.nom?escapeHtml(c.nom):''}</option>`).join('')}</datalist>`;
}

function creditsClientsStats(list){
  list = list || DB.creditsClients;
  const encours = list.reduce((s,c)=>s+(c.montant - c.montantPaye),0);
  const totalAccorde = list.reduce((s,c)=>s+c.montant,0);
  const enCours = list.filter(c=>c.statut==='En cours').length;
  return { encours, totalAccorde, enCours };
}

let creditsClientsFilters = { dateDebut:'', dateFin:'' };
/* =========================================================
   VUE : OPÉRATIONS — liste combinée Crédits/Avances/Ristournes
   Un seul écran, un seul bouton d'ajout. Le choix du type dans le
   formulaire redirige vers le modal détaillé existant de chaque
   module (réutilise leur logique de validation/sauvegarde sans la
   dupliquer). Les 3 modules détaillés restent disponibles séparément.
   ========================================================= */
let operationsFilters = { type:'', dateDebut:'', dateFin:'' };

function renderOperationsView(){
  document.getElementById('topbarActions').innerHTML = `<button class="btn btn-gold" onclick="openNouvelleOperationModal()">+ Nouvelle opération</button>`;
  const host = document.getElementById('viewsHost');

  const credits = (DB.creditsClients||[]).map(c=>({
    type:'Crédit client', typeKey:'credit', tiers:c.client, montant:c.montant, encaisse:c.montantPaye,
    date:c.date, statut:c.statut, id:c.id
  }));
  const avances = (DB.avances||[]).map(a=>({
    type:'Avance', typeKey:'avance', tiers:a.deposant + (a.client!=='—'?' → '+a.client:''), montant:a.montant, encaisse:a.montantRembourse,
    date:a.date, statut:a.statut, id:a.id
  }));
  const ristournes = (DB.retours||[]).map(r=>({
    type:'Ristourne', typeKey:'ristourne', tiers:r.client, montant:r.montant, encaisse:r.montantRembourse,
    date:r.date, statut:r.statut, id:r.id
  }));

  let list = [...credits, ...avances, ...ristournes];
  if(operationsFilters.type) list = list.filter(o=>o.typeKey===operationsFilters.type);
  if(operationsFilters.dateDebut || operationsFilters.dateFin) list = list.filter(o=>inDateRange(o.date, operationsFilters.dateDebut, operationsFilters.dateFin));
  list.sort((a,b)=>new Date(b.date)-new Date(a.date));

  const totalEncours = list.reduce((s,o)=>s+(o.montant-o.encaisse),0);
  const totalMontant = list.reduce((s,o)=>s+o.montant,0);

  const typeIcon = { credit:'creditNote', avance:'advance', ristourne:'returns' };
  const typeAction = {
    credit:{ label:'Encaisser', fn:'openCreditClientPaiementModal', edit:'openCreditClientModal', del:'deleteCreditClient' },
    avance:{ label:'Rembourser', fn:'openAvanceRemboursementModal', edit:'openAvanceModal', del:'deleteAvance' },
    ristourne:{ label:'Encaisser', fn:'openRetourRemboursementModal', edit:'openRetourModal', del:'deleteRetour' },
  };

  host.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card" style="--accent:var(--gold)"><div class="lbl"><span class="ic">${icon('creditNote')}</span>Total des opérations</div><div class="val">${fmtGNF(totalMontant)}</div></div>
      <div class="kpi-card" style="--accent:var(--red)"><div class="lbl"><span class="ic">${icon('warning')}</span>Encours global</div><div class="val">${fmtGNF(totalEncours)}</div></div>
      <div class="kpi-card" style="--accent:var(--teal)"><div class="lbl"><span class="ic">${icon('creditNote')}</span>Nombre d'opérations</div><div class="val">${fmtNum(list.length)}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <h3>Opérations</h3>
        <div class="chip-select">
          <select onchange="operationsFilters.type=this.value; renderOperationsView()">
            <option value="">Tous les types</option>
            <option value="credit" ${operationsFilters.type==='credit'?'selected':''}>Crédit client</option>
            <option value="avance" ${operationsFilters.type==='avance'?'selected':''}>Avance</option>
            <option value="ristourne" ${operationsFilters.type==='ristourne'?'selected':''}>Ristourne</option>
          </select>
          ${dateRangeFilterHtml(operationsFilters.dateDebut, operationsFilters.dateFin,
            "operationsFilters.dateDebut=this.value; renderOperationsView()",
            "operationsFilters.dateFin=this.value; renderOperationsView()",
            "operationsFilters.dateDebut=''; operationsFilters.dateFin=''; renderOperationsView()")}
        </div>
        <div class="sub">${list.length} opération(s)</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Type</th><th>Tiers</th><th>Date</th><th>Montant</th><th>Reçu/Payé</th><th>Reste</th><th>Statut</th><th></th></tr></thead>
          <tbody>${list.length ? list.map(o=>{
            const reste = o.montant - o.encaisse;
            const act = typeAction[o.typeKey];
            return `<tr>
              <td><span class="ic">${icon(typeIcon[o.typeKey])}</span> ${escapeHtml(o.type)}</td>
              <td class="strong">${escapeHtml(o.tiers)}</td>
              <td style="white-space:nowrap">${fmtDate(o.date)}</td>
              <td>${fmtGNF(o.montant)}</td>
              <td style="color:var(--green)">${fmtGNF(o.encaisse)}</td>
              <td style="color:${reste>0?'var(--red)':'var(--text-dim)'}">${fmtGNF(reste)}</td>
              <td><span class="pill ${o.statut==='Soldé'?'pill-ok':'pill-warn'}">${escapeHtml(o.statut)}</span></td>
              <td style="white-space:nowrap">
                ${reste>0?`<button class="btn btn-teal btn-sm" onclick="${act.fn}('${o.id}')">${act.label}</button>`:''}
                <button class="btn btn-outline btn-sm" onclick="${act.edit}('${o.id}')">Modifier</button>
                <button class="btn btn-danger btn-sm" onclick="${act.del}('${o.id}')">Suppr.</button>
              </td>
            </tr>`;
          }).join('') : `<tr><td colspan="8">Aucune opération ne correspond aux filtres.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
}

function openNouvelleOperationModal(){
  openModal(`
    <div class="modal-head"><h3>Nouvelle opération</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <p style="font-size:12.5px;color:var(--text-mid);margin-top:-8px">Choisissez le type d'opération à enregistrer.</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:6px">
      <button class="btn btn-outline" style="justify-content:flex-start;gap:10px" onclick="closeModal(); openCreditClientModal()"><span class="ic">${icon('creditNote')}</span> Crédit client — créance accordée à un client</button>
      <button class="btn btn-outline" style="justify-content:flex-start;gap:10px" onclick="closeModal(); openAvanceModal()"><span class="ic">${icon('advance')}</span> Avance — dépôt reçu à rembourser</button>
      <button class="btn btn-outline" style="justify-content:flex-start;gap:10px" onclick="closeModal(); openRetourModal()"><span class="ic">${icon('returns')}</span> Ristourne — bonus attendu d'un distributeur</button>
    </div>
    <div class="modal-foot"><button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button></div>`);
}

let creditsClientsScope = 'jour'; // 'jour' | 'historique' | 'tous'
function renderCreditsClientsView(){
  document.getElementById('topbarActions').innerHTML = `<button class="btn btn-gold" onclick="openCreditClientModal()">+ Nouveau crédit</button>`;
  const host = document.getElementById('viewsHost');
  let list = [...DB.creditsClients];
  const today = todayISO();
  if(creditsClientsScope==='jour') list = list.filter(c=>c.date.slice(0,10)===today);
  else if(creditsClientsScope==='historique') list = list.filter(c=>c.date.slice(0,10)!==today);
  if(creditsClientsFilters.dateDebut || creditsClientsFilters.dateFin) list = list.filter(c=>inDateRange(c.date, creditsClientsFilters.dateDebut, creditsClientsFilters.dateFin));
  list.sort((a,b)=>new Date(b.date)-new Date(a.date));
  const s = creditsClientsStats(list);
  host.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card" style="--accent:var(--gold)"><div class="lbl"><span class="ic">${icon('float')}</span>Encours total</div><div class="val">${fmtGNF(s.encours)}</div></div>
      <div class="kpi-card" style="--accent:var(--teal)"><div class="lbl"><span class="ic">${icon('orders')}</span>Total accordé</div><div class="val">${fmtGNF(s.totalAccorde)}</div></div>
      <div class="kpi-card" style="--accent:var(--orange)"><div class="lbl"><span class="ic">${icon('creditNote')}</span>Crédits en cours</div><div class="val">${fmtNum(s.enCours)}</div></div>
      <div class="kpi-card" style="--accent:var(--red)"><div class="lbl"><span class="ic">${icon('warning')}</span>Comptes non soldés</div><div class="val">${fmtNum(list.filter(c=>c.statut!=='Soldé').length)}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <h3>Créances clients</h3>
        <div class="chip-select">
          <select onchange="creditsClientsScope=this.value; renderCreditsClientsView()">
            <option value="jour" ${creditsClientsScope==='jour'?'selected':''}>Aujourd'hui</option>
            <option value="historique" ${creditsClientsScope==='historique'?'selected':''}>Historique (hors aujourd'hui)</option>
            <option value="tous" ${creditsClientsScope==='tous'?'selected':''}>Tout</option>
          </select>
          ${dateRangeFilterHtml(creditsClientsFilters.dateDebut, creditsClientsFilters.dateFin,
            "creditsClientsFilters.dateDebut=this.value; renderCreditsClientsView()",
            "creditsClientsFilters.dateFin=this.value; renderCreditsClientsView()",
            "creditsClientsFilters.dateDebut=''; creditsClientsFilters.dateFin=''; renderCreditsClientsView()")}
        </div>
        <div class="sub">${list.length} enregistrement(s)</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Client</th><th>Nom</th><th>Crédit</th><th>Payé</th><th>Reste</th><th>Statut</th><th></th></tr></thead>
          <tbody>${list.map(c=>{
            const reste = c.montant - c.montantPaye;
            return `<tr>
              <td>${fmtDate(c.date)}</td>
              <td class="strong">${escapeHtml(c.client)}</td>
              <td style="color:var(--text-dim)">${escapeHtml(c.nom||'—')}</td>
              <td>${fmtGNF(c.montant)}</td>
              <td style="color:var(--green)">${fmtGNF(c.montantPaye)}</td>
              <td style="color:${reste>0?'var(--red)':'var(--text-dim)'}">${fmtGNF(reste)}</td>
              <td><span class="pill ${c.statut==='Soldé'?'pill-ok':'pill-warn'}">${escapeHtml(c.statut)}</span></td>
              <td style="white-space:nowrap">
                ${reste>0?`<button class="btn btn-teal btn-sm" onclick="openCreditClientPaiementModal('${c.id}')">Encaisser</button>`:''}
                <button class="btn btn-outline btn-sm" onclick="openCreditClientModal('${c.id}')">Modifier</button>
                <button class="btn btn-danger btn-sm" onclick="deleteCreditClient('${c.id}')">Suppr.</button>
              </td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    </div>`;
}

function openCreditClientModal(id){
  const existing = id ? DB.creditsClients.find(c=>c.id===id) : null;
  openModal(`
    <div class="modal-head"><h3>${existing?'Modifier le crédit client':'Nouveau crédit client'}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <form id="ccForm">
      <div class="form-grid">
        <div class="field"><label>N° client</label><input type="text" id="ccClient" list="ccClientList" placeholder="ex. 621950000" value="${existing?escapeHtml(existing.client):''}" required>${clientsDatalist('ccClientList')}</div>
        <div class="field"><label>Nom (optionnel)</label><input type="text" id="ccNom" placeholder="ex. Camara Amadou" value="${existing&&existing.nom!=='—'?escapeHtml(existing.nom):''}"></div>
        <div class="field"><label>Montant du crédit (GNF)</label><input type="number" id="ccMontant" min="${existing?existing.montantPaye:1}" value="${existing?existing.montant:''}" required></div>
        <div class="field"><label>Date</label><input type="date" id="ccDate" value="${existing?existing.date:todayISO()}" required></div>
      </div>
      <div class="login-error" id="ccError"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn btn-gold">${existing?'Enregistrer':'Enregistrer'}</button>
      </div>
    </form>`);
  document.getElementById('ccForm').addEventListener('submit', e=>{
    e.preventDefault();
    const montant = parsePositiveAmount(document.getElementById('ccMontant').value);
    const dateVal = document.getElementById('ccDate').value;
    const errEl = document.getElementById('ccError');
    if(montant===null){ errEl.textContent = 'Le montant doit être un nombre positif.'; return; }
    if(refuserSiDateVerrouillee(dateVal)) return;
    if(existing){
      if(montant < existing.montantPaye){ errEl.textContent = `Le montant ne peut pas être inférieur au montant déjà payé (${fmtGNF(existing.montantPaye)}).`; return; }
      existing.client = document.getElementById('ccClient').value.trim();
      existing.nom = document.getElementById('ccNom').value.trim() || '—';
      existing.montant = montant; existing.date = dateVal;
      existing.statut = existing.montantPaye >= existing.montant ? 'Soldé' : 'En cours';
      logActivity(`Crédit client modifié : ${fmtGNF(montant)} (${existing.client})`);
      saveDB(); closeModal(); renderCreditsClientsView(); toast('Crédit client mis à jour','success');
    } else {
      DB.creditsClients.unshift({ id: uid('CC'), client: document.getElementById('ccClient').value.trim(),
        nom: document.getElementById('ccNom').value.trim() || '—', montant, montantPaye: 0,
        date: dateVal, statut:'En cours' });
      logActivity(`Crédit client accordé : ${fmtGNF(montant)}`);
      saveDB(); closeModal(); renderCreditsClientsView(); toast('Crédit client enregistré','success');
    }
  });
}

function deleteCreditClient(id){
  if(!requireRole('Administrateur','Direction','Comptable','Responsable Agence','Agent PDV')) return;
  const c = DB.creditsClients.find(x=>x.id===id);
  if(!c) return;
  if(!confirm(`Supprimer le crédit client de ${c.client} (${fmtGNF(c.montant)}) ? Cette action est irréversible.`)) return;
  DB.creditsClients = DB.creditsClients.filter(x=>x.id!==id);
  logActivity(`Crédit client supprimé : ${c.client} (${fmtGNF(c.montant)})`);
  saveDB(); renderCreditsClientsView(); toast('Crédit client supprimé','success');
}

function openCreditClientPaiementModal(id){
  const c = DB.creditsClients.find(x=>x.id===id);
  if(!c) return;
  const reste = c.montant - c.montantPaye;
  openModal(`
    <div class="modal-head"><h3>Encaisser un paiement</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <p style="font-size:12.5px;color:var(--text-mid);margin-top:-8px">Client ${escapeHtml(c.client)} — reste dû : <b style="color:var(--text-hi)">${fmtGNF(reste)}</b></p>
    <form id="ccPayForm">
      <div class="form-grid">
        <div class="field full"><label>Montant encaissé (GNF)</label><input type="number" id="ccPayMontant" min="1" max="${reste}" value="${reste}" required></div>
      </div>
      <div class="login-error" id="ccPayError"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn btn-gold">Encaisser</button>
      </div>
    </form>`);
  document.getElementById('ccPayForm').addEventListener('submit', e=>{
    e.preventDefault();
    const montant = parsePositiveAmount(document.getElementById('ccPayMontant').value);
    const errEl = document.getElementById('ccPayError');
    if(montant===null){ errEl.textContent = 'Le montant doit être un nombre positif.'; return; }
    if(montant > reste){ errEl.textContent = 'Le montant dépasse le reste dû.'; return; }
    if(refuserSiDateVerrouillee(todayISO())) return;
    c.montantPaye += montant;
    if(c.montantPaye >= c.montant) c.statut = 'Soldé';
    logActivity(`Paiement crédit client reçu : ${fmtGNF(montant)} (${c.client})`);
    saveDB(); closeModal(); renderCreditsClientsView(); toast('Paiement enregistré','success');
  });
}

/* =========================================================
   VUE : AVANCES
   ========================================================= */
function avancesStats(list){
  list = list || DB.avances;
  const encours = list.reduce((s,a)=>s+(a.montant - a.montantRembourse),0);
  const totalDepose = list.reduce((s,a)=>s+a.montant,0);
  return { encours, totalDepose, enCours: list.filter(a=>a.statut!=='Soldée').length };
}

let avancesFilters = { dateDebut:'', dateFin:'' };
let avancesScope = 'toutes'; // 'toutes' | 'nonremboursees'
function renderAvancesView(){
  document.getElementById('topbarActions').innerHTML = `<button class="btn btn-gold" onclick="openAvanceModal()">+ Nouvelle avance</button>`;
  const host = document.getElementById('viewsHost');
  let list = [...DB.avances];
  if(avancesScope==='nonremboursees') list = list.filter(a=>(a.montant - a.montantRembourse) > 0);
  if(avancesFilters.dateDebut || avancesFilters.dateFin) list = list.filter(a=>inDateRange(a.date, avancesFilters.dateDebut, avancesFilters.dateFin));
  list.sort((a,b)=>new Date(b.date)-new Date(a.date));
  const s = avancesStats(list);
  host.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card" style="--accent:var(--gold)"><div class="lbl"><span class="ic">${icon('advance')}</span>Encours non remboursé</div><div class="val">${fmtGNF(s.encours)}</div></div>
      <div class="kpi-card" style="--accent:var(--teal)"><div class="lbl"><span class="ic">${icon('orders')}</span>Total déposé</div><div class="val">${fmtGNF(s.totalDepose)}</div></div>
      <div class="kpi-card" style="--accent:var(--orange)"><div class="lbl"><span class="ic">${icon('advance')}</span>Avances actives</div><div class="val">${fmtNum(s.enCours)}</div></div>
      <div class="kpi-card" style="--accent:var(--red)"><div class="lbl"><span class="ic">${icon('warning')}</span>Total avances</div><div class="val">${fmtNum(list.length)}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <h3>Avances</h3>
        <div class="chip-select">
          <select onchange="avancesScope=this.value; renderAvancesView()">
            <option value="toutes" ${avancesScope==='toutes'?'selected':''}>Toutes les avances</option>
            <option value="nonremboursees" ${avancesScope==='nonremboursees'?'selected':''}>Non remboursées uniquement</option>
          </select>
          ${dateRangeFilterHtml(avancesFilters.dateDebut, avancesFilters.dateFin,
            "avancesFilters.dateDebut=this.value; renderAvancesView()",
            "avancesFilters.dateFin=this.value; renderAvancesView()",
            "avancesFilters.dateDebut=''; avancesFilters.dateFin=''; renderAvancesView()")}
        </div>
        <div class="sub">${list.length} enregistrement(s)</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Déposant</th><th>Client</th><th>Déposé</th><th>Remboursé</th><th>Reste</th><th>Statut</th><th></th></tr></thead>
          <tbody>${list.map(a=>{
            const reste = a.montant - a.montantRembourse;
            return `<tr>
              <td>${fmtDate(a.date)}</td>
              <td class="strong">${escapeHtml(a.deposant)}</td>
              <td style="color:var(--text-dim)">${escapeHtml(a.client||'—')}</td>
              <td>${fmtGNF(a.montant)}</td>
              <td style="color:var(--green)">${fmtGNF(a.montantRembourse)}</td>
              <td style="color:${reste>0?'var(--red)':'var(--text-dim)'}">${fmtGNF(reste)}</td>
              <td><span class="pill ${a.statut==='Soldée'?'pill-ok':(a.statut==='Partielle'?'pill-warn':'pill-danger')}">${escapeHtml(a.statut)}</span></td>
              <td style="white-space:nowrap">
                ${reste>0?`<button class="btn btn-teal btn-sm" onclick="openAvanceRemboursementModal('${a.id}')">Rembourser</button>`:''}
                <button class="btn btn-outline btn-sm" onclick="openAvanceModal('${a.id}')">Modifier</button>
                <button class="btn btn-danger btn-sm" onclick="deleteAvance('${a.id}')">Suppr.</button>
              </td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    </div>`;
}

function openAvanceModal(id){
  const existing = id ? DB.avances.find(a=>a.id===id) : null;
  openModal(`
    <div class="modal-head"><h3>${existing?"Modifier l'avance":'Nouvelle avance'}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <form id="avForm">
      <div class="form-grid">
        <div class="field"><label>Nom du déposant</label><input type="text" id="avDeposant" value="${existing?escapeHtml(existing.deposant):''}" required></div>
        <div class="field"><label>N° client (optionnel)</label><input type="text" id="avClient" list="avClientList" placeholder="ex. 611083569" value="${existing&&existing.client!=='—'?escapeHtml(existing.client):''}">${clientsDatalist('avClientList')}</div>
        <div class="field"><label>Montant déposé (GNF)</label><input type="number" id="avMontant" min="${existing?existing.montantRembourse:1}" value="${existing?existing.montant:''}" required></div>
        <div class="field"><label>Date</label><input type="date" id="avDate" value="${existing?existing.date:todayISO()}" required></div>
      </div>
      <div class="login-error" id="avError"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn btn-gold">Enregistrer</button>
      </div>
    </form>`);
  document.getElementById('avForm').addEventListener('submit', e=>{
    e.preventDefault();
    const montant = parsePositiveAmount(document.getElementById('avMontant').value);
    const dateVal = document.getElementById('avDate').value;
    const errEl = document.getElementById('avError');
    if(montant===null){ errEl.textContent = 'Le montant doit être un nombre positif.'; return; }
    if(refuserSiDateVerrouillee(dateVal)) return;
    if(existing){
      if(montant < existing.montantRembourse){ errEl.textContent = `Le montant ne peut pas être inférieur au montant déjà remboursé (${fmtGNF(existing.montantRembourse)}).`; return; }
      existing.deposant = document.getElementById('avDeposant').value.trim();
      existing.client = document.getElementById('avClient').value.trim() || '—';
      existing.montant = montant; existing.date = dateVal;
      existing.statut = existing.montantRembourse >= existing.montant ? 'Soldée' : (existing.montantRembourse>0?'Partielle':'En cours');
      logActivity(`Avance modifiée : ${fmtGNF(montant)} (${existing.deposant})`);
      saveDB(); closeModal(); renderAvancesView(); toast('Avance mise à jour','success');

/* =========================================================
   VUE : CLÔTURE JOURNALIÈRE
   Calcule automatiquement, pour une date donnée, le total reçu
   (crédits payés + avances remboursées + ristournes reçues du
   jour) et le compare à la somme réellement répartie entre les
   receveurs. L'écart (manquant/excédent) apparaît immédiatement.
   Les montants "reçus" et la répartition restent modifiables
   manuellement au cas où la caisse diffère du calcul théorique.
   ========================================================= */
// Vérifie si la date donnée appartient à une clôture déjà verrouillée. Utilisée
// par tous les points de saisie (ventes/stock, crédits clients, avances,
// ristournes) pour empêcher qu'une opération datée d'un jour clôturé ne fausse
// silencieusement le rapprochement de caisse déjà validé (totalRecu/totalRembourse
// de la clôture sont figés au moment du clôturage et ne se recalculent pas seuls).
function dateEstVerrouilleeParCloture(dateStr){
  const jour = (dateStr||'').slice(0,10);
  const c = (DB.clotures||[]).find(x=>x.date===jour);
  return !!(c && c.statut === 'Clôturée');
}
function refuserSiDateVerrouillee(dateStr){
  if(dateEstVerrouilleeParCloture(dateStr)){
    toast(`Le ${fmtDate(dateStr)} est déjà clôturé et verrouillé. Demandez à un administrateur de rouvrir la clôture pour modifier une opération à cette date.`,'error');
    return true;
  }
  return false;
}

function clotureAutoTotals(dateISO){
  const credits = (DB.creditsClients||[]).filter(c=>c.date.slice(0,10)===dateISO);
  const avances = (DB.avances||[]).filter(a=>a.date.slice(0,10)===dateISO);
  const retours = (DB.retours||[]).filter(r=>r.date.slice(0,10)===dateISO);
  const ventesJour = (DB.ventes||[]).filter(v=>v.date.slice(0,10)===dateISO);
  const creditPaye = credits.reduce((s,c)=>s+c.montantPaye,0);
  const avanceDeposee = avances.reduce((s,a)=>s+a.montant,0);
  const avanceRembourse = avances.reduce((s,a)=>s+a.montantRembourse,0);
  const retourRembourse = retours.reduce((s,r)=>s+r.montantRembourse,0);
  // Dépôt (cash-in) = argent reçu du client ; Retrait (cash-out) = argent rendu au
  // client. L'e-recharge est un encaissement (paiement client contre crédit
  // téléphonique), donc traitée comme un "reçu", au même titre qu'un dépôt.
  const depotJour = ventesJour.filter(v=>v.type==='depot').reduce((s,v)=>s+v.montant,0);
  const retraitJour = ventesJour.filter(v=>v.type==='retrait').reduce((s,v)=>s+v.montant,0);
  const eRechargeJour = ventesJour.filter(v=>v.type==='e-recharge').reduce((s,v)=>s+v.montant,0);
  const totalRecu = creditPaye + avanceDeposee + depotJour + eRechargeJour;
  const totalRembourse = avanceRembourse + retourRembourse + retraitJour;
  return { creditPaye, avanceDeposee, avanceRembourse, retourRembourse, depotJour, retraitJour, eRechargeJour, totalRecu, totalRembourse };
}
function findOrInitCloture(dateISO){
  let c = DB.clotures.find(x=>x.date===dateISO);
  if(!c){
    const auto = clotureAutoTotals(dateISO);
    c = { id: uid('CLO'), date: dateISO, totalRecu: auto.totalRecu, totalRembourse: auto.totalRembourse, receveurs: [], statut:'Ouverte' };
  }
  if(!c.statut) c.statut = 'Ouverte'; // migration douce des clôtures créées avant l'ajout du statut
  return c;
}
function clotureStatutPillClass(s){ return s === 'Clôturée' ? 'pill-cloturee' : 'pill-ok'; }

            return `

function cloturerDefinitivement(dateISO){
  if(!requireRole('Administrateur','Direction','Comptable')) return;
  let existing = DB.clotures.find(x=>x.date===dateISO);
  if(!existing){
    const auto = clotureAutoTotals(dateISO);
    existing = { id: uid('CLO'), date: dateISO, totalRecu: auto.totalRecu, totalRembourse: auto.totalRembourse, receveurs: [], statut:'Ouverte' };
    DB.clotures.push(existing);
  }
  const totalReparti = (existing.receveurs||[]).reduce((s,r)=>s+r.montant,0);
  const manquant = existing.totalRecu - existing.totalRembourse - totalReparti;
  if(manquant !== 0 && !confirm(`Il reste un écart de ${fmtGNF(Math.abs(manquant))} (${manquant>0?'manquant':'excédent'}) non réparti. Clôturer quand même ?`)) return;
  existing.statut = 'Clôturée';
  logActivity(`Clôture verrouillée définitivement pour le ${fmtDate(dateISO)}`);
  saveDB(); renderClotureView(); toast('Journée clôturée et verrouillée','success');
}
function reouvrirCloture(dateISO){
  if(!requireRole('Administrateur','Direction')) return;
  const existing = DB.clotures.find(x=>x.date===dateISO);
  if(!existing) return;
  if(!confirm(`Rouvrir la clôture du ${fmtDate(dateISO)} pour modification ?`)) return;
  existing.statut = 'Ouverte';
  logActivity(`Clôture rouverte pour modification : ${fmtDate(dateISO)}`);

}
function openClotureAjusterModal(){

    <form id="cloForm">

    let existing = DB.clotures.find(x=>x.date===clotureCurrentDate);
    if(!existing){ existing = { id: uid('CLO'), date: clotureCurrentDate, receveurs: [], statut:'Ouverte' }; DB.clotures.push(existing); }
    existing.totalRecu = recu; existing.totalRembourse = rembourse;
    logActivity(`Clôture ajustée pour le ${fmtDate(clotureCurrentDate)} : reçu ${fmtGNF(recu)}, remboursé ${fmtGNF(rembourse)}`);

function openReceveurModal(dateISO){
  const existing0 = DB.clotures.find(x=>x.date===dateISO);
  if(existing0 && existing0.statut === 'Clôturée'){ toast('Cette clôture est verrouillée. Rouvrez-la pour la modifier.','error'); return; }
  const c = findOrInitCloture(dateISO);
  const totalReparti = (c.receveurs||[]).reduce((s,r)=>s+r.montant,0);
  const restant = c.totalRecu - c.totalRembourse - totalReparti;
  openModal(`
    <div class="modal-head"><h3>Ajouter un receveur</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <p style="font-size:12.5px;color:var(--text-mid);margin-top:-8px">Reste à répartir : ${fmtGNF(Math.max(restant,0))}${restant<0?` (déjà en excédent de ${fmtGNF(Math.abs(restant))})`:''}</p>
    <form id="recForm">
      <div class="form-grid">
        <div class="field"><label>Nom du receveur</label>
          <select id="recNom" required>
            <option value="" disabled selected>Sélectionner…</option>
            ${DB.users.map(u=>`<option value="${escapeHtml(u.nom)}">${escapeHtml(u.nom)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Montant reçu (GNF)</label><input type="number" id="recMontant" min="1" required></div>
      </div>
      <div class="login-error" id="recError"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn btn-gold">Ajouter</button>
      </div>
    </form>`);
  document.getElementById('recForm').addEventListener('submit', e=>{
    e.preventDefault();
    const nom = document.getElementById('recNom').value.trim();
    const montant = parsePositiveAmount(document.getElementById('recMontant').value);
    const errEl = document.getElementById('recError');
    if(!nom){ errEl.textContent = 'Le nom du receveur est requis.'; return; }
    if(montant===null){ errEl.textContent = 'Le montant doit être un nombre positif.'; return; }
    if(restant > 0 && montant > restant){ errEl.textContent = `Ce montant dépasse le reste à répartir (${fmtGNF(restant)}).`; return; }
    if(restant <= 0){ errEl.textContent = `Rien à répartir : la clôture est déjà à l'équilibre ou en excédent.`; return; }
    let existing = DB.clotures.find(x=>x.date===dateISO);
    if(!existing){
      const auto = clotureAutoTotals(dateISO);
      existing = { id: uid('CLO'), date: dateISO, totalRecu: auto.totalRecu, totalRembourse: auto.totalRembourse, receveurs: [], statut:'Ouverte' };
      DB.clotures.push(existing);
    }
    existing.receveurs.push({ nom, montant });
    logActivity(`Receveur ajouté à la clôture du ${fmtDate(dateISO)} : ${nom} (${fmtGNF(montant)})`);
    saveDB(); closeModal(); renderClotureView(); toast('Receveur ajouté','success');
  });
}
function deleteReceveur(dateISO, idx){
  if(!requireRole('Administrateur','Direction','Comptable')) return;
  const c = DB.clotures.find(x=>x.date===dateISO);
  if(!c || !c.receveurs[idx]) return;
  if(c.statut === 'Clôturée'){ toast('Cette clôture est verrouillée. Rouvrez-la pour la modifier.','error'); return; }
  const r = c.receveurs[idx];
  if(!confirm(`Supprimer ${r.nom} (${fmtGNF(r.montant)}) de la répartition ?`)) return;
  c.receveurs.splice(idx,1);
  logActivity(`Receveur supprimé de la clôture du ${fmtDate(dateISO)} : ${r.nom}`);
  saveDB(); renderClotureView(); toast('Receveur supprimé','success');
}
function deleteCloture(dateISO){
  if(!requireRole('Administrateur','Direction','Comptable')) return;
  const c = DB.clotures.find(x=>x.date===dateISO);
  if(!c) return;
  if(c.statut === 'Clôturée'){ toast('Cette clôture est verrouillée. Rouvrez-la avant de la supprimer.','error'); return; }
  if(!confirm(`Supprimer définitivement la clôture du ${fmtDate(dateISO)} (reçu ${fmtGNF(c.totalRecu)}, ${c.receveurs.length} receveur(s)) ? Cette action est irréversible. Les crédits/avances/ristournes/ventes sous-jacents ne sont pas affectés.`)) return;
  DB.clotures = DB.clotures.filter(x=>x.date!==dateISO);
  logActivity(`Clôture supprimée : ${fmtDate(dateISO)}`);
  saveDB();
  if(clotureCurrentDate===dateISO) clotureCurrentDate = todayISO();
  renderClotureView(); toast('Clôture supprimée','success');
}

/* =========================================================
   VUE : TRÉSORERIE
   Suivi jour par jour des commandes (entrées de fonds prévues)
   et des versements (sorties réelles), avec solde couru calculé
   automatiquement. Une alerte visuelle apparaît dès que le solde
   devient négatif.
   ========================================================= */
let tresorerieFilters = { dateDebut:'', dateFin:'' };
function tresorerieAvecSolde(){
  const list = [...DB.tresorerie].sort((a,b)=>new Date(a.date)-new Date(b.date));
  let solde = 0;
  return list.map(t=>{
    solde += (t.commande||0) - (t.versement||0);
    return { ...t, soldeCouru: solde };
  });
}
function renderTresorerieView(){
  document.getElementById('topbarActions').innerHTML = `<button class="btn btn-gold" onclick="openTresorerieModal()">+ Nouvelle entrée</button>`;
  const host = document.getElementById('viewsHost');
  let list = tresorerieAvecSolde();
  if(tresorerieFilters.dateDebut || tresorerieFilters.dateFin) list = list.filter(t=>inDateRange(t.date, tresorerieFilters.dateDebut, tresorerieFilters.dateFin));
  const dernier = list.length ? list[list.length-1] : null;
  const soldeActuel = dernier ? dernier.soldeCouru : 0;
  const totalCommande = list.reduce((s,t)=>s+(t.commande||0),0);
  const totalVersement = list.reduce((s,t)=>s+(t.versement||0),0);
  const sorted = [...list].sort((a,b)=>new Date(b.date)-new Date(a.date));
  host.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card" style="--accent:var(--teal)"><div class="lbl"><span class="ic">${icon('orders')}</span>Total commandes</div><div class="val">${fmtGNF(totalCommande)}</div></div>
      <div class="kpi-card" style="--accent:var(--gold)"><div class="lbl"><span class="ic">${icon('sales')}</span>Total versements</div><div class="val">${fmtGNF(totalVersement)}</div></div>
      <div class="kpi-card" style="--accent:${soldeActuel<0?'var(--red)':'var(--green)'}"><div class="lbl"><span class="ic">${icon(soldeActuel<0?'warning':'float')}</span>Solde couru</div><div class="val">${fmtGNF(soldeActuel)}</div></div>
      <div class="kpi-card" style="--accent:var(--orange)"><div class="lbl"><span class="ic">${icon('reports')}</span>Entrées enregistrées</div><div class="val">${fmtNum(list.length)}</div></div>
    </div>
    ${soldeActuel<0 ? `<div class="panel" style="border-color:var(--red);margin-bottom:14px"><div style="padding:12px;color:var(--red);font-weight:700">⚠️ Le solde de trésorerie est négatif (${fmtGNF(soldeActuel)}). Les versements dépassent les commandes reçues.</div></div>` : ''}
    <div class="panel">
      <div class="panel-head">
        <h3>Commandes &amp; versements</h3>
        <div class="chip-select">
          ${dateRangeFilterHtml(tresorerieFilters.dateDebut, tresorerieFilters.dateFin,
            "tresorerieFilters.dateDebut=this.value; renderTresorerieView()",
            "tresorerieFilters.dateFin=this.value; renderTresorerieView()",
            "tresorerieFilters.dateDebut=''; tresorerieFilters.dateFin=''; renderTresorerieView()")}
        </div>
        <div class="sub">${list.length} entrée(s)</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Commande</th><th>Versement</th><th>Solde couru</th><th></th></tr></thead>
          <tbody>${sorted.length ? sorted.map(t=>`
            <tr>
              <td>${fmtDate(t.date)}</td>
              <td>${t.commande?fmtGNF(t.commande):'—'}</td>
              <td>${t.versement?fmtGNF(t.versement):'—'}</td>
              <td style="color:${t.soldeCouru<0?'var(--red)':'var(--text-hi)'};font-weight:700">${fmtGNF(t.soldeCouru)}</td>
              <td style="white-space:nowrap">
                <button class="btn btn-outline btn-sm" onclick="openTresorerieModal('${t.id}')">Modifier</button>
                <button class="btn btn-danger btn-sm" onclick="deleteTresorerie('${t.id}')">Suppr.</button>
              </td>
            </tr>`).join('') : `<tr><td colspan="5">Aucune entrée pour cette période.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
}
function openTresorerieModal(id){
  const existing = id ? DB.tresorerie.find(t=>t.id===id) : null;
  openModal(`
    <div class="modal-head"><h3>${existing?"Modifier l'entrée":'Nouvelle entrée de trésorerie'}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <form id="trezForm">
      <div class="form-grid">
        <div class="field full"><label>Date</label><input type="date" id="trezDate" value="${existing?existing.date:todayISO()}" required></div>
        <div class="field"><label>Commande (GNF)</label><input type="number" id="trezCommande" min="0" value="${existing?existing.commande||'':''}" placeholder="0"></div>
        <div class="field"><label>Versement (GNF)</label><input type="number" id="trezVersement" min="0" value="${existing?existing.versement||'':''}" placeholder="0"></div>
      </div>
      <div class="login-error" id="trezError"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn btn-gold">Enregistrer</button>
      </div>
    </form>`);
  document.getElementById('trezForm').addEventListener('submit', e=>{
    e.preventDefault();
    const commande = parseNonNegativeAmount(document.getElementById('trezCommande').value || '0');
    const versement = parseNonNegativeAmount(document.getElementById('trezVersement').value || '0');
    const errEl = document.getElementById('trezError');
    if(commande===null || versement===null){ errEl.textContent = 'Les montants doivent être des nombres positifs ou nuls.'; return; }
    if(commande===0 && versement===0){ errEl.textContent = 'Renseignez au moins une commande ou un versement.'; return; }
    const date = document.getElementById('trezDate').value;
    if(existing){
      existing.date = date; existing.commande = commande; existing.versement = versement;
      logActivity(`Entrée trésorerie modifiée (${fmtDate(date)})`);
      saveDB(); closeModal(); renderTresorerieView(); toast('Entrée mise à jour','success');
    } else {
      DB.tresorerie.push({ id: uid('TRZ'), date, commande, versement });
      logActivity(`Entrée trésorerie ajoutée (${fmtDate(date)}) : commande ${fmtGNF(commande)}, versement ${fmtGNF(versement)}`);
      saveDB(); closeModal(); renderTresorerieView(); toast('Entrée enregistrée','success');
    }
  });
}
function deleteTresorerie(id){
  if(!requireRole('Administrateur','Direction','Comptable')) return;
  const t = DB.tresorerie.find(x=>x.id===id);
  if(!t) return;
  if(!confirm(`Supprimer l'entrée du ${fmtDate(t.date)} ? Cette action est irréversible.`)) return;
  DB.tresorerie = DB.tresorerie.filter(x=>x.id!==id);
  logActivity(`Entrée trésorerie supprimée (${fmtDate(t.date)})`);
  saveDB(); renderTresorerieView(); toast('Entrée supprimée','success');
}

/* =========================================================
   VUE : CRÉDIT FOURNISSEUR OFMG
   ========================================================= */
let creditMouvementsFilter = '';
function renderCreditView(){
  document.getElementById('topbarActions').innerHTML = `
    <button class="btn btn-outline" onclick="openEcheanceModal()">+ Nouvelle échéance</button>
    <button class="btn btn-gold" onclick="openPaiementModal()">+ Enregistrer un paiement</button>`;
  const host = document.getElementById('viewsHost');
  const c = DB.creditOFMG;
  const today = new Date(todayISO());
  const mouvementsFiltres = c.mouvements.filter(m => !creditMouvementsFilter || m.type===creditMouvementsFilter);
  // Statut calculé dynamiquement : une échéance non soldée dont la date est dépassée est "En retard"
  const echeancesTriees = [...c.echeances].sort((a,b)=>new Date(a.dateEcheance)-new Date(b.dateEcheance)).map(e=>{
    const statutCalcule = e.statut==='Soldée' ? 'Soldée' : (new Date(e.dateEcheance)<today ? 'En retard' : 'À venir');
    return {...e, statutCalcule};
  });
  const retard = echeancesTriees.filter(e=>e.statutCalcule==='En retard');

  host.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card" style="--accent:var(--orange)"><div class="lbl"><span class="ic">${icon('float')}</span> Solde crédit OFMG</div><div class="val">${fmtGNF(c.solde)}</div></div>
      <div class="kpi-card" style="--accent:var(--red)"><div class="lbl"><span class="ic">${icon('warning')}</span> Échéances en retard</div><div class="val">${retard.length}</div></div>
      <div class="kpi-card" style="--accent:var(--green)"><div class="lbl"><span class="ic">${icon('orders')}</span> Total payé (historique)</div><div class="val">${fmtGNF(Math.abs(c.mouvements.filter(m=>m.type==='paiement').reduce((s,m)=>s+m.montant,0)))}</div></div>
      <div class="kpi-card" style="--accent:var(--gold)"><div class="lbl"><span class="ic">${icon('wholesaler')}</span> Total commandé (historique)</div><div class="val">${fmtGNF(c.mouvements.filter(m=>m.type==='augmentation').reduce((s,m)=>s+m.montant,0))}</div></div>
    </div>

    ${retard.length ? `<div class="panel">${retard.map(e=>`
      <div class="alert-box alert-danger" style="align-items:center">
        <span>${icon('warning',16)}</span>
        <div style="flex:1"><b>Échéance en retard</b> — ${fmtGNF(e.montant)} — ${escapeHtml(e.note)} (échéance : ${fmtDate(e.dateEcheance)})</div>
        <button class="btn btn-sm btn-gold" onclick="openPaiementModal('${e.id}')">Régler</button>
      </div>`).join('')}</div>` : ''}

    <div class="panel">
      <div class="panel-head"><h3>Évolution du solde crédit OFMG</h3><div class="sub">Chronologique, du plus ancien au plus récent</div></div>
      <canvas id="chartCreditOFMG" height="90"></canvas>
    </div>

    <div class="two-col">
      <div class="panel">
        <div class="panel-head">
          <h3>Historique des mouvements</h3>
          <div class="chip-select no-print">
            <select onchange="creditMouvementsFilter=this.value; renderCreditView()">
              <option value="">Tous les types</option>
              <option value="augmentation" ${creditMouvementsFilter==='augmentation'?'selected':''}>Augmentation</option>
              <option value="paiement" ${creditMouvementsFilter==='paiement'?'selected':''}>Paiement</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Type</th><th>Montant</th><th>Référence</th><th>Date</th><th>Note</th></tr></thead>
            <tbody>${mouvementsFiltres.length ? mouvementsFiltres.map(m=>`
              <tr>
                <td><span class="pill ${m.type==='augmentation'?'pill-warn':'pill-ok'}">${m.type==='augmentation'?'Augmentation':'Paiement'}</span></td>
                <td class="${m.montant<0?'':''}" style="color:${m.montant<0?'var(--green)':'var(--gold-light)'}">${m.montant<0?'':'+'}${fmtGNF(m.montant)}</td>
                <td>${escapeHtml(m.reference)}</td>
                <td>${fmtDate(m.date)}</td>
                <td style="color:var(--text-dim)">${escapeHtml(m.note)}</td>
              </tr>`).join('') : `<tr><td colspan="5" style="text-align:center;color:var(--text-dim)">Aucun mouvement pour ce filtre.</td></tr>`}</tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Échéancier</h3></div>
        ${echeancesTriees.map(e=>`
          <div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)">
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;gap:8px">
              <span class="strong" style="color:var(--text-hi)">${fmtGNF(e.montant)}</span>
              <span class="pill ${e.statutCalcule==='En retard'?'pill-danger':(e.statutCalcule==='Soldée'?'pill-ok':'pill-warn')}">${e.statutCalcule}</span>
            </div>
            <div style="font-size:11.5px;color:var(--text-dim);margin-top:3px">${escapeHtml(e.note)} · Échéance ${fmtDate(e.dateEcheance)}</div>
            ${e.statutCalcule!=='Soldée' ? `<button class="btn btn-sm btn-outline" style="margin-top:6px" onclick="openPaiementModal('${e.id}')">Marquer payée / régler</button>` : ''}
          </div>`).join('') || `<div class="empty-state"><div class="ic">${icon('orders',28)}</div><div class="msg">Aucune échéance en cours.</div></div>`}
      </div>
    </div>`;
  drawCreditOFMGChart(c);
}

let chart4 = null;
function drawCreditOFMGChart(c){
  const ctx = document.getElementById('chartCreditOFMG');
  if(!ctx) return;
  // Reconstitue le solde couru chronologique à partir du solde actuel en remontant les mouvements
  const chrono = [...c.mouvements].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const soldesChrono = [];
  let s = c.solde;
  for(let i=chrono.length-1;i>=0;i--){ soldesChrono.unshift(s); s -= chrono[i].montant; }
  const labels = chrono.map(m=>fmtDate(m.date));
  if(chart4) chart4.destroy();
  chart4 = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets:[{ label:'Solde crédit (GNF)', data: soldesChrono, borderColor:'#ff7900', backgroundColor:'rgba(255,121,0,.12)', fill:true, tension:.25, pointRadius:2 }]},
    options:{ plugins:{legend:{display:false}}, scales:{
      x:{ ticks:{color:'#a8b3c7', font:{size:10}, maxRotation:0, autoSkip:true, maxTicksLimit:8}, grid:{display:false} },
      y:{ ticks:{color:'#a8b3c7', font:{size:10}, callback:v=>(v/1000000).toFixed(0)+'M'}, grid:{color:'rgba(255,255,255,.05)'} }
    }}
  });
}

  openModal(`

      <div class="form-grid">
        <div class="field"><label>Montant (GNF)</label><input type="number" id="payMontant" min="1" value="${ech?ech.montant:''}" required></div>
        <div class="field"><label>Date</label><input type="date" id="payDate" value="${todayISO()}" required></div>
        <div class="field full"><label>Référence bancaire</label><input type="text" id="payRef" placeholder="ex. VIR-778900" required></div>
        <div class="field full"><label>Note</label><input type="text" id="payNote" placeholder="ex. Paiement échéance mensuelle" value="${ech?'Règlement : '+escapeHtml(ech.note):''}"></div>
      </div>
      <div class="login-error" id="payError"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn btn-gold">Enregistrer le paiement</button>
      </div>
    </form>`);
  document.getElementById('payForm').addEventListener('submit', e=>{
    e.preventDefault();
    const montant = parsePositiveAmount(document.getElementById('payMontant').value);
    const errEl = document.getElementById('payError');
    if(montant===null){ errEl.textContent = 'Le montant doit être un nombre positif.'; return; }
    if(montant > DB.creditOFMG.solde){
      errEl.textContent = `Le montant dépasse le solde actuel (${fmtGNF(DB.creditOFMG.solde)}).`;
      return;
    }
    DB.creditOFMG.solde -= montant;
    DB.creditOFMG.mouvements.unshift({ id: uid('CR'), type:'paiement', montant: -montant, date: document.getElementById('payDate').value,
      reference: document.getElementById('payRef').value.trim(), note: document.getElementById('payNote').value.trim() || 'Paiement OFMG' });
    // Une échéance n'est soldée que si le paiement couvre au moins son montant ;
    // un paiement partiel réduit le solde global mais laisse l'échéance ouverte,
    // pour ne pas perdre la traçabilité du reste dû sur cette échéance précise.
    let soldeMsg = '';
    if(ech){
      if(montant >= ech.montant){ ech.statut = 'Soldée'; soldeMsg = ' (échéance soldée)'; }
      else { soldeMsg = ' (paiement partiel — échéance toujours ouverte)'; }
    }
    logActivity(`Paiement OFMG enregistré : ${fmtGNF(montant)}${soldeMsg}`);
    saveDB(); closeModal(); renderCreditView(); toast('Paiement enregistré, solde mis à jour','success');
  });
}

function scopedVentes(){ return DB.ventes.filter(v=>isInScopePdv(v.refId)); }
function scopedTransferts(){ return DB.transferts.filter(t=>true); }
function scopedConversions(){ return DB.conversions.filter(c=>isInScopePdv(c.pdvId)); }

// Construit les données consolidées d'un rapport pour l'export (PDF et Excel partagent la même logique)
function buildRapportData(type, date){
  const d30 = new Date(); d30.setDate(d30.getDate()-30);
  const ventes30 = scopedVentes().filter(v=>new Date(v.date)>=d30);
  const transferts30 = scopedTransferts().filter(t=>new Date(t.date)>=d30);
  const conversions30 = scopedConversions().filter(c=>new Date(c.date)>=d30);
  if(type==='ventes'){
    return {titre:'Rapport des ventes — 30 derniers jours',
      kpis:[['Volume total',fmtGNF(ventes30.reduce((s,v)=>s+v.montant,0))],['Nombre de ventes',ventes30.length],['Ticket moyen',fmtGNF(ventes30.length?ventes30.reduce((s,v)=>s+v.montant,0)/ventes30.length:0)]],
      tables:[{titre:'Détail des ventes',cols:['PDV','Type','Montant (GNF)','Date'],rows:ventes30.map(v=>[pdvName(v.refId),v.type,v.montant,fmtDate(v.date)])}]};
  }
  if(type==='transferts'){
    return {titre:'Rapport des transferts — 30 derniers jours',
      kpis:[['Montant float',fmtGNF(transferts30.filter(t=>t.type==='float').reduce((s,t)=>s+t.montant,0))],['Nombre de transferts',transferts30.length],['Unités',fmtNum(transferts30.filter(t=>t.type!=='float').reduce((s,t)=>s+t.montant,0))]],
      tables:[{titre:'Détail des transferts',cols:['De','Vers','Type','Montant','Date'],rows:transferts30.map(t=>[nodeLabel(t.de),nodeLabel(t.vers),t.type,t.type==='float'?fmtGNF(t.montant):fmtNum(t.montant),fmtDate(t.date)])}]};
  }
  if(type==='commissions'){
    return {titre:'Rapport des commissions Dual Wallet — 30 jours',
      kpis:[['Commissions',fmtGNF(conversions30.reduce((s,c)=>s+c.commission,0))],['Conversions',conversions30.length],['Volume converti',fmtGNF(conversions30.reduce((s,c)=>s+c.montantFloat,0))]],
      tables:[{titre:'Détail des commissions',cols:['PDV','Float','Commission (GNF)','Date'],rows:conversions30.map(c=>[pdvName(c.pdvId),c.montantFloat,c.commission,fmtDate(c.date)])}]};
  }
  if(type==='credits'){
    const rows=(DB.creditsClients||[]).filter(c=>new Date(c.date)>=d30);
    return {titre:'Rapport des crédits clients — 30 jours',
      kpis:[['Montant accordé',fmtGNF(rows.reduce((s,c)=>s+c.montant,0))],['Dossiers',rows.length],['Encours',fmtGNF((typeof creditsClientsStats==='function'?creditsClientsStats().encours:0))]],
      tables:[{titre:'Crédits clients',cols:['Client','Montant (GNF)','Date','Statut'],rows:rows.map(c=>[c.client,c.montant,fmtDate(c.date),c.statut||'En cours'])}]};
  }
  if(type==='avances'){
    const rows=(DB.avances||[]).filter(a=>new Date(a.date)>=d30);
    return {titre:'Rapport des avances — 30 jours',
      kpis:[['Montant total',fmtGNF(rows.reduce((s,a)=>s+a.montant,0))],['Nombre',rows.length],['Moyenne',fmtGNF(rows.length?rows.reduce((s,a)=>s+a.montant,0)/rows.length:0)]],
      tables:[{titre:'Détail des avances',cols:['Déposant','Montant (GNF)','Date','Référence'],rows:rows.map(a=>[a.deposant,a.montant,fmtDate(a.date),a.reference||'—'])}]};
  }
  if(type==='retours'){
    const rows=(DB.retours||[]).filter(r=>new Date(r.date)>=d30);
    return {titre:'Rapport des retours — 30 jours',
      kpis:[['Montant retourné',fmtGNF(rows.reduce((s,r)=>s+r.montant,0))],['Retours',rows.length],['Remboursé',fmtGNF(rows.reduce((s,r)=>s+(r.montantRembourse||0),0))]],
      tables:[{titre:'Détail des retours',cols:['Client','Montant (GNF)','Remboursé','Date'],rows:rows.map(r=>[r.client,r.montant,r.montantRembourse||0,fmtDate(r.date)])}]};
  }
  if(type==='commandes'){
    const rows=(DB.commandes||[]).filter(c=>new Date(c.date||c.createdAt||0)>=d30);
    return {titre:'Rapport des commandes — 30 jours',
      kpis:[['Commandes',rows.length],['Montant',fmtGNF(rows.reduce((s,c)=>s+(c.montant||0),0))],['Clôturées',rows.filter(c=>c.statut==='Clôturée').length]],
      tables:[{titre:'Détail des commandes',cols:['Référence','Montant (GNF)','Statut','Date'],rows:rows.map(c=>[c.reference,c.montant||0,c.statut||'—',fmtDate(c.date||c.createdAt)])}]};
  }
  if(type==='pdv'){
    const by={}; ventes30.forEach(v=>{by[v.refId]=(by[v.refId]||0)+v.montant;});
    const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([id,val],i)=>[i+1,pdvName(id),val]);
    return {titre:'Rapport de performance des PDV — 30 jours',
      kpis:[['PDV actifs',rows.length],['Volume total',fmtGNF(ventes30.reduce((s,v)=>s+v.montant,0))],['Meilleur PDV',rows[0]?rows[0][1]:'—']],
      tables:[{titre:'Classement des PDV',cols:['#','PDV','Volume (GNF)'],rows}]};
  }
  if(type==='cloture'){
    const rows = (DB.clotures||[]).filter(c=>new Date(c.date)>=d30).sort((a,b)=>new Date(b.date)-new Date(a.date));
    const totalRecu = rows.reduce((s,c)=>s+(c.totalRecu||0),0);
    const totalRembourse = rows.reduce((s,c)=>s+(c.totalRembourse||0),0);
    const totalManquant = rows.reduce((s,c)=>{
      const rep = (c.receveurs||[]).reduce((ss,r)=>ss+r.montant,0);
      return s + Math.max(0, (c.totalRecu||0) - (c.totalRembourse||0) - rep);
    },0);
    return {titre:'Rapport des clôtures journalières — 30 jours',
      kpis:[['Total reçu',fmtGNF(totalRecu)],['Total remboursé',fmtGNF(totalRembourse)],['Manquant cumulé',fmtGNF(totalManquant)]],
      tables:[{titre:'Clôtures',cols:['Date','Total reçu (GNF)','Total remboursé (GNF)','Réparti (GNF)','Écart (GNF)'],rows:rows.map(c=>{
        const rep = (c.receveurs||[]).reduce((s,r)=>s+r.montant,0);
        const ecart = (c.totalRecu||0) - (c.totalRembourse||0) - rep;
        return [fmtDate(c.date), c.totalRecu||0, c.totalRembourse||0, rep, ecart];
      })}]};
  }
  if(type==='tresorerie'){
    const listAll = tresorerieAvecSolde().filter(t=>new Date(t.date)>=d30);
    const totalCommande = listAll.reduce((s,t)=>s+(t.commande||0),0);
    const totalVersement = listAll.reduce((s,t)=>s+(t.versement||0),0);
    const soldeActuel = listAll.length ? listAll[listAll.length-1].soldeCouru : 0;
    return {titre:'Rapport de trésorerie — 30 jours',
      kpis:[['Total commandes',fmtGNF(totalCommande)],['Total versements',fmtGNF(totalVersement)],['Solde couru actuel',fmtGNF(soldeActuel)]],
      tables:[{titre:'Commandes & versements',cols:['Date','Commande (GNF)','Versement (GNF)','Solde couru (GNF)'],rows:listAll.slice().reverse().map(t=>[fmtDate(t.date), t.commande||0, t.versement||0, t.soldeCouru])}]};
  }
  if(type==='global'){
    return {titre:'Rapport d’activité globale — 30 jours',
      kpis:[['Ventes',fmtGNF(ventes30.reduce((s,v)=>s+v.montant,0))],['Transferts',transferts30.length],['Commissions',fmtGNF(conversions30.reduce((s,c)=>s+c.commission,0))]],
      tables:[
        {titre:'Ventes',cols:['PDV','Type','Montant (GNF)','Date'],rows:ventes30.map(v=>[pdvName(v.refId),v.type,v.montant,fmtDate(v.date)])},
        {titre:'Transferts',cols:['De','Vers','Type','Montant','Date'],rows:transferts30.map(t=>[nodeLabel(t.de),nodeLabel(t.vers),t.type,t.montant,fmtDate(t.date)])}
      ]};
  }
  if(type==='journalier'){
    const d = date || todayISO();
    const ventes = scopedVentes().filter(v=>v.date.slice(0,10)===d);
    const transferts = scopedTransferts().filter(t=>t.date.slice(0,10)===d);
    const conversions = scopedConversions().filter(c=>c.date.slice(0,10)===d);
    const creditMouvements = DB.creditOFMG.mouvements.filter(m=>m.date.slice(0,10)===d);
    const cloture = (DB.clotures||[]).find(c=>c.date===d);
    const repartiJour = cloture ? (cloture.receveurs||[]).reduce((s,r)=>s+r.montant,0) : 0;
    const manquantJour = cloture ? (cloture.totalRecu||0) - (cloture.totalRembourse||0) - repartiJour : null;
    const trezJour = (DB.tresorerie||[]).find(t=>t.date===d);
    const soldeCouruJour = tresorerieAvecSolde().find(t=>t.date===d);
    return {
      titre: `Rapport journalier — ${fmtDate(d)}`,
      kpis: [
        ['Stock float total (clôture)', fmtGNF(totalStockFloat('all'))],
        ['Volume ventes du jour', fmtGNF(ventes.reduce((s,v)=>s+v.montant,0))],
        ['Commissions Dual Wallet', fmtGNF(conversions.reduce((s,c)=>s+c.commission,0))],
        ['Clôture — total reçu', cloture ? fmtGNF(cloture.totalRecu||0) : 'Non clôturé'],
        ['Clôture — écart (manquant/excédent)', cloture ? fmtGNF(Math.abs(manquantJour)) + (manquantJour>0?' (manquant)':manquantJour<0?' (excédent)':'') : '—'],
        ['Trésorerie — solde couru', soldeCouruJour ? fmtGNF(soldeCouruJour.soldeCouru) : '—'],
      ],
      tables: [
        { titre:'Ventes du jour', cols:['PDV','Type','Montant (GNF)'], rows: ventes.map(v=>[pdvName(v.refId), v.type, v.montant]) },
        { titre:'Transferts du jour', cols:['De','Vers','Type','Montant'], rows: transferts.map(t=>[nodeLabel(t.de), nodeLabel(t.vers), t.type, t.montant]) },
        { titre:'Mouvements de crédit OFMG', cols:['Type','Montant (GNF)','Référence'], rows: creditMouvements.map(m=>[m.type, Math.abs(m.montant), m.reference]) },
        { titre:'Répartition par receveur (clôture)', cols:['Receveur','Montant (GNF)'], rows: cloture ? (cloture.receveurs||[]).map(r=>[r.nom, r.montant]) : [] },
        { titre:'Trésorerie du jour', cols:['Commande (GNF)','Versement (GNF)','Solde couru (GNF)'], rows: trezJour ? [[trezJour.commande||0, trezJour.versement||0, soldeCouruJour?soldeCouruJour.soldeCouru:0]] : [] },
      ]
    };
  }
  if(type==='hebdomadaire'){
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-7);
    const ventes = scopedVentes().filter(v=>new Date(v.date)>=cutoff);
    const parPdv = {}; ventes.forEach(v=>{ parPdv[v.refId] = (parPdv[v.refId]||0)+v.montant; });
    const perfPdv = Object.entries(parPdv).sort((a,b)=>b[1]-a[1]).map(([id,val])=>[pdvName(id), val]);
    return {
      titre:'Rapport hebdomadaire (7 derniers jours)',
      kpis: [
        ['Volume 7 jours', fmtGNF(ventes.reduce((s,v)=>s+v.montant,0))],
        ['Nombre de ventes', ventes.length],
      ],
      tables: [
        { titre:'Performance par PDV', cols:['PDV','Volume (GNF)'], rows: perfPdv },
        { titre:'Détail des ventes', cols:['PDV','Type','Montant (GNF)','Date'], rows: ventes.map(v=>[pdvName(v.refId), v.type, v.montant, fmtDate(v.date)]) },
      ]
    };
  }
  // mensuel
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-30);
  const ventes = scopedVentes().filter(v=>new Date(v.date)>=cutoff);
  const conversions = scopedConversions().filter(c=>new Date(c.date)>=cutoff);
  const ranking = topPdvByVolume(30);
  return {
    titre:'Rapport mensuel (30 derniers jours)',
    kpis: [
      ['Volume total', fmtGNF(ventes.reduce((s,v)=>s+v.montant,0))],
      ['Commissions cumulées', fmtGNF(conversions.reduce((s,c)=>s+c.commission,0))],
      ['Crédit OFMG (solde actuel)', fmtGNF(DB.creditOFMG.solde)],
    ],
    tables: [
      { titre:'Ranking PDV (30 jours)', cols:['PDV','Volume (GNF)'], rows: ranking.map(r=>[r.nom, r.val]) },
      { titre:'Détail des ventes', cols:['PDV','Type','Montant (GNF)','Date'], rows: ventes.map(v=>[pdvName(v.refId), v.type, v.montant, fmtDate(v.date)]) },
    ]
  };
}

function imprimerRapport(type, date){
  const data = buildRapportData(type, date);
  const w = window.open('', '_blank');
  if(!w){ toast('Autorisez les fenêtres pop-up pour imprimer.','error'); return; }
  w.document.write(`<html><head><title>${escapeHtml(data.titre)}</title><style>
    *{box-sizing:border-box}body{font-family:Arial,sans-serif;padding:28px;color:#172554}

function exportRapportExcel(type, date){
  const data = buildRapportData(type, date);
  const wb = XLSX.utils.book_new();
  const wsResume = XLSX.utils.aoa_to_sheet([
    [data.titre], [],
    [`Généré le ${fmtDateTime(nowISO())} par ${currentUser().nom}`], [],
    ...data.kpis.map(([lbl,val])=>[lbl, val])
  ]);
  XLSX.utils.book_append_sheet(wb, wsResume, 'Résumé');
  data.tables.forEach(t=>{
    if(!t.rows.length) return;
    const ws = XLSX.utils.aoa_to_sheet([t.cols, ...t.rows]);
    XLSX.utils.book_append_sheet(wb, ws, t.titre.slice(0,31));
  });
  XLSX.writeFile(wb, `MPS_rapport_${type}_${date||todayISO()}.xlsx`);
  toast('Fichier Excel exporté','success');
}

// Affiche/masque les champs Agence et PDV selon le rôle sélectionné, et
// recharge la liste des PDV en conséquence (corrige le bug où un Agent PDV
// créé via l'interface n'avait jamais de pdvId assigné).
function refreshUserRoleFields(){
  const role = document.getElementById('uRole').value;
  const showAg = role==='Responsable Agence' || role==='Agent PDV';
  document.getElementById('uAgenceWrap').style.display = showAg ? 'flex' : 'none';
  document.getElementById('uPdvWrap').style.display = role==='Agent PDV' ? 'flex' : 'none';
  if(role==='Agent PDV') refreshUserPdvOptions();
}
function refreshUserPdvOptions(selectedPdvId){
  const pdvSel = document.getElementById('uPdv');
  if(!pdvSel) return;
  const agenceId = document.getElementById('uAgence').value;
  const list = pdvsOfAgence(agenceId);
  pdvSel.innerHTML = list.length
    ? list.map(p=>`<option value="${p.id}" ${p.id===selectedPdvId?'selected':''}>${escapeHtml(p.nom)}</option>`).join('')
    : '<option value="">Aucun PDV dans cette agence</option>';
}
function openUserModal(id){
  const existing = id ? DB.users.find(u=>u.id===id) : null;
  const ags = DB.agences;
  const showAgence = existing && (existing.role==='Responsable Agence'||existing.role==='Agent PDV');
  const showPdv = existing && existing.role==='Agent PDV';
  let pendingPhoto = existing ? (existing.photo || null) : null;
  const initialsFor = nom => (nom||'').trim().split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase() || '?';
  openModal(`
    <div class="modal-head"><h3>${existing?"Modifier l'utilisateur":'Nouvel utilisateur'}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <form id="userForm">
      <div class="avatar-picker" style="margin-bottom:16px">
        <div class="preview" id="avatarPreview">${pendingPhoto ? `<img src="${pendingPhoto}" alt="">` : initialsFor(existing?existing.nom:'')}</div>
        <div class="actions">
          <label class="btn btn-outline btn-sm" for="uPhotoInput" style="cursor:pointer;text-align:center">Choisir une photo</label>
          <input type="file" id="uPhotoInput" accept="image/*">
          ${pendingPhoto ? `<button type="button" class="btn btn-outline btn-sm" id="uPhotoRemove" style="color:var(--red)">Retirer la photo</button>` : ''}
          <div style="font-size:11px;color:var(--text-dim)">JPG/PNG, 5 Mo max, recadrée automatiquement</div>
        </div>
      </div>
      <div class="form-grid">
        <div class="field full"><label>Nom complet</label><input type="text" id="uNom" value="${existing?escapeHtml(existing.nom):''}" required></div>
        <div class="field"><label>Identifiant de connexion</label><input type="text" id="uLogin" value="${existing?escapeHtml(existing.login):''}" ${existing&&existing.id==='admin'?'readonly':''} required></div>
        <div class="field"><label>Mot de passe</label><input type="password" id="uPass" autocomplete="new-password" placeholder="${existing?'Laisser vide pour ne pas changer':''}" ${existing?'':'required'}></div>
        <div class="field full"><label>Rôle</label>
          <select id="uRole" ${existing&&existing.id==='admin'?'disabled':''} onchange="refreshUserRoleFields()">
            ${['Administrateur','Direction','Responsable Agence','Comptable','Agent PDV'].map(r=>`<option ${existing&&existing.role===r?'selected':''}>${r}</option>`).join('')}
          </select>
        </div>
        <div class="field full" id="uAgenceWrap" style="display:${showAgence?'flex':'none'}">
          <label>Agence de rattachement</label>
          <select id="uAgence" onchange="refreshUserPdvOptions()">${ags.map(a=>`<option value="${a.id}" ${existing&&existing.agenceId===a.id?'selected':''}>${escapeHtml(a.nom)}</option>`).join('')}</select>
        </div>
        <div class="field full" id="uPdvWrap" style="display:${showPdv?'flex':'none'}">
          <label>PDV de rattachement</label>
          <select id="uPdv"></select>
        </div>
      </div>
      <div class="login-error" id="userError"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
        <button type="submit" class="btn btn-gold">${existing?'Enregistrer':"Créer l'utilisateur"}</button>
      </div>
    </form>`);
  const refreshPreview = ()=>{
    const el = document.getElementById('avatarPreview');
    const nomVal = document.getElementById('uNom').value;
    el.innerHTML = pendingPhoto ? `<img src="${pendingPhoto}" alt="">` : initialsFor(nomVal);
  };
  refreshUserPdvOptions(existing?existing.pdvId:null);
  document.getElementById('uNom').addEventListener('input', ()=>{ if(!pendingPhoto) refreshPreview(); });
  document.getElementById('uPhotoInput').addEventListener('change', async e=>{
    const file = e.target.files[0];
    if(!file) return;
    document.getElementById('userError').textContent = '';
    try{
      pendingPhoto = await resizeImageToDataURL(file);
      refreshPreview();
    }catch(err){
      document.getElementById('userError').textContent = err.message || 'Impossible de charger cette image.';
      e.target.value = '';
    }
  });
  const removeBtn = document.getElementById('uPhotoRemove');
  if(removeBtn) removeBtn.addEventListener('click', ()=>{ pendingPhoto = null; document.getElementById('uPhotoInput').value=''; refreshPreview(); });
  document.getElementById('userForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const role = document.getElementById('uRole').value;
    const login = document.getElementById('uLogin').value.trim();
    const nom = document.getElementById('uNom').value.trim();
    const dup = DB.users.find(u=>u.login.toLowerCase()===login.toLowerCase() && (!existing || u.id!==existing.id));
    if(dup){ document.getElementById('userError').textContent = 'Cet identifiant existe déjà.'; return; }
    const passRaw = document.getElementById('uPass').value;

    // pas uniquement des espaces).
    if((!existing || passRaw) && passRaw.trim().length < 6){
      document.getElementById('userError').textContent = 'Le mot de passe doit contenir au moins 6 caractères.';
      return;
    }
    const agenceId = (role==='Responsable Agence'||role==='Agent PDV') ? document.getElementById('uAgence').value : null;
    const pdvId = role==='Agent PDV' ? (document.getElementById('uPdv').value || null) : null;
    if(role==='Agent PDV' && !pdvId){ document.getElementById('userError').textContent = "Sélectionnez le PDV de rattachement (aucun PDV disponible dans cette agence)."; return; }
    if(existing){
      existing.nom = nom; existing.login = login; existing.photo = pendingPhoto;
      // Si l'admin définit un nouveau mot de passe pour ce compte, l'utilisateur
      // devra le changer à sa prochaine connexion (il ne doit pas rester sur
      // un mot de passe choisi par quelqu'un d'autre).
      // ATTENTION LIMITATION CONNUE : ceci ne met à jour QUE le mot de passe
      // local (passHash). Le compte Firebase Auth de cet utilisateur garde
      // son ANCIEN mot de passe, car changer le mot de passe d'un tiers
      // exige Firebase Admin SDK côté serveur (absent de cette app 100%
      // client). Concrètement : au prochain login de cet utilisateur avec
      // le nouveau mot de passe, la connexion locale réussira mais la
      // connexion Firebase échouera (repli automatique en mode dégradé,
      // voir loginWithAppCredentials) — l'app reste utilisable, seule la
      // synchronisation par rôle Firestore est temporairement dégradée.
      // L'écran "changement de mot de passe obligatoire" (mustChangePassword)
      // que l'utilisateur verra ensuite corrige les DEUX mots de passe à la
      // fois — voir renderForceChangePassword.
      if(passRaw){ existing.passHash = await hashPassword(passRaw); existing.mustChangePassword = true; }
      if(existing.id!=='admin'){ existing.role = role; existing.agenceId = agenceId; existing.pdvId = pdvId; }
      logActivity(`Utilisateur modifié : ${nom}`);
      saveDB(); closeModal(); renderUtilisateursView(); renderSidebar(); toast('Utilisateur mis à jour','success');
    } else {
      const passHash = await hashPassword(passRaw);
      DB.users.push({ id: uid('U'), nom, login, passHash, role, agenceId, pdvId, photo: pendingPhoto, mustChangePassword:true });
      logActivity(`Utilisateur créé : ${nom} (${role})`);
      saveDB(); closeModal(); renderUtilisateursView(); toast('Utilisateur créé','success');
    }
  });
}
function deleteUser(id){
  if(!requireRole('Administrateur')) return;
  if(id==='admin'){ toast("Le compte administrateur principal ne peut pas être supprimé.",'error'); return; }
  if(SESSION && SESSION.userId===id){ toast('Vous ne pouvez pas supprimer votre propre compte pendant que vous êtes connecté.','error'); return; }
  const u = DB.users.find(x=>x.id===id);
  if(!u) return;
  if(!confirm(`Supprimer l'utilisateur « ${u.nom} » (${u.login}) ?`)) return;
  DB.users = DB.users.filter(x=>x.id!==id);
  logActivity(`Utilisateur supprimé : ${u.nom}`);
  saveDB(); renderUtilisateursView(); toast('Utilisateur supprimé','success');
}

/* =========================================================
   VUE : PARAMÈTRES

function daysSinceBackup(){
  if(!DB.settings.lastBackupDate) return null;
  return Math.floor((new Date() - new Date(DB.settings.lastBackupDate)) / 86400000);
}
function backupStatusInfo(){
  const days = daysSinceBackup();
  if(days===null) return { color:'var(--red)', text:"Aucune sauvegarde n'a encore été exportée.", grave:true };
  if(days===0) return { color:'var(--green)', text:"Dernière sauvegarde : aujourd'hui.", grave:false };
  if(days===1) return { color:'var(--green)', text:"Dernière sauvegarde : hier.", grave:false };
  if(days<=7) return { color:'var(--green)', text:`Dernière sauvegarde il y a ${days} jours.`, grave:false };
  if(days<=14) return { color:'var(--gold)', text:`Dernière sauvegarde il y a ${days} jours — pensez à en refaire une.`, grave:false };
  return { color:'var(--red)', text:`Dernière sauvegarde il y a ${days} jours — fortement recommandé d'exporter maintenant.`, grave:true };
}
function renderParametresView(){
  document.getElementById('topbarActions').innerHTML = '';
  const host = document.getElementById('viewsHost');
  const bs = backupStatusInfo();
  host.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h3>Paramètres généraux</h3></div>
      <form id="paramForm" class="form-grid">
        <div class="field"><label>Taux commission Dual Wallet (%)</label><input type="number" step="0.1" id="pTaux" value="${DB.settings.tauxCommissionDualWallet}"></div>
        <div class="field"><label>Seuil alerte stock float bas (GNF)</label><input type="number" id="pSeuilF" value="${DB.settings.alerteFloatSeuil}"></div>
        <div class="field full"><label>Seuil alerte stock e-recharge bas (paquets)</label><input type="number" id="pSeuilR" step="1" value="${Math.round((DB.settings.alerteRechargeSeuil||0)/100)}"></div>
        <div class="field full"><button type="submit" class="btn btn-gold">Enregistrer</button></div>
      </form>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Données & sauvegarde</h3><div class="sub">Export complet possible à tout moment</div></div>
      <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--border);margin-bottom:14px">
        <span style="width:9px;height:9px;border-radius:50%;background:${bs.color};flex-shrink:0"></span>
        <span style="font-size:13px;color:var(--text-hi)">${escapeHtml(bs.text)}</span>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-teal" onclick="exportFullBackup()">Exporter toutes les données (JSON)</button>
        <button class="btn btn-danger" onclick="resetDemoData()">Remettre toutes les données à zéro</button>
        <button class="btn btn-danger" onclick="resetAllToEmpty()">Vider toutes les données (démarrage à blanc)</button>
      </div>
    </div>`;
  document.getElementById('paramForm').addEventListener('submit', e=>{
    e.preventDefault();

    const seuilRPaquets = Number(document.getElementById('pSeuilR').value);
    if(!Number.isFinite(taux) || taux < 0 || taux > 100){ toast('Le taux de commission doit être compris entre 0 et 100%.','error'); return; }
    if(!Number.isFinite(seuilF) || seuilF < 0){ toast('Le seuil d\'alerte float doit être positif ou nul.','error'); return; }
    if(!Number.isFinite(seuilRPaquets) || seuilRPaquets < 0){ toast('Le seuil d\'alerte e-recharge doit être positif ou nul.','error'); return; }
    DB.settings.tauxCommissionDualWallet = taux;
